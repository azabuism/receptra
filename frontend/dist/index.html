<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="レセプトラ - 飲食店・美容・ホテル・教育から医療まで全サービス業種の検索・予約プラットフォーム。">
    <meta name="og:title" content="レセプトラ">
    <meta name="og:description" content="飲食・美容・ホテル・教育から医療など。サービスを検索・予約ができます。">
    <title>レセプトラ - 全業種対応の検索・予約プラットフォーム</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-light: #ff9500;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --error: #ef4444;
            --success: #10b981;
            --border: 1px solid #ddd;
            --rating-color: #fbbf24;
        }

        html, body {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* ナビゲーション */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom: var(--border);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            height: 60px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--dark);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo svg {
            width: 100%;
            height: 100%;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--dark);
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-button:hover {
            background: var(--light);
        }

        .nav-button.primary {
            background: var(--primary);
            color: var(--white);
        }

        .nav-button.primary:hover {
            background: var(--primary-dark);
        }

        /* メインコンテンツ */
        main {
            margin-top: 60px;
            flex: 1;
            overflow-y: auto;
        }

        /* ヒーローセクション */
        .hero {
            background-image: url('/images/receptra-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
            text-align: center;
            min-height: 450px;
            aspect-ratio: 2048 / 768;
            position: relative;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 16px;
            color: var(--dark);
            font-weight: 700;
        }

        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 32px;
            max-width: 700px;
            line-height: 1.8;
            font-weight: 500;
        }

        .hero-buttons {
            position: absolute;
            top: 76%;
            left: 50%;
            transform: translate(calc(-50% - 100px), 0);
            width: 100%;
            padding: 0 20px;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* 検索セクション */
        .search-section {
            background: linear-gradient(135deg, #FF6B35 0%, #ff8b5f 100%);
            padding: 40px 20px;
            color: var(--white);
        }

        .search-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .search-section h2 {
            font-size: 24px;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 700;
        }

        .search-form-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input-wrapper input,
        .search-input-wrapper select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark);
            transition: all 0.3s;
        }

        .search-input-wrapper input:focus,
        .search-input-wrapper select:focus {
            outline: none;
            border-color: var(--white);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .search-input-wrapper input::placeholder {
            color: #999;
        }

        .search-input-wrapper label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            opacity: 0.95;
            font-weight: 600;
        }

        .search-button {
            align-self: flex-end;
            padding: 12px 40px;
            background: var(--white);
            color: var(--primary);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        .search-button:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        /* カテゴリーセクション */
        .categories-section {
            padding: 60px 20px;
            background: var(--white);
        }

        .categories-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            color: var(--dark);
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .category-card {
            background: linear-gradient(135deg, #fff9f5 0%, #fff0e6 100%);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--dark);
        }

        .category-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.15);
        }

        .category-icon {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f0f0f0 0%, #e8e8e8 100%);
        }

        .category-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .category-icon.emoji-icon {
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .category-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
        }

        /* フッター */
        footer {
            background: var(--dark);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .footer-links a:hover {
            opacity: 0.8;
        }

        .footer-copy {
            font-size: 12px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }

            .search-form-wrapper {
                flex-direction: column;
            }

            .search-row {
                flex-direction: column;
            }

            .categories-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 16px;
            }

            .category-icon {
                font-size: 40px;
            }

            .category-name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- ナビゲーション -->
    <nav>
        <a href="#" class="nav-brand">
            <div class="nav-logo"><img src="/assets/receptra-logo-C-Qf2VZF.png" alt="RECEPTRA Logo" style="max-width: 100%; height: auto;"></div>
            <span>レセプトラ</span>
        </a>
        <div class="nav-right">
            <button class="nav-button">ログイン</button>
            <button class="nav-button primary">今すぐ予約</button>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <main>
        <!-- ヒーローセクション -->
        <section class="hero">
            <h1 class="sr-only">レセプトラ</h1>
            <div class="hero-buttons">
                <button class="btn btn-primary" onclick="scrollToSearch()">今すぐ検索</button>
                <button class="btn btn-secondary" onclick="goToSubcategories()">カテゴリーから探す</button>
            </div>
        </section>

        <!-- 検索セクション -->
        <section class="search-section" id="search-section">
            <div class="search-container">
                <h2>🔍 サービスを探す</h2>
                <form class="search-form-wrapper" onsubmit="handleSearch(event)">
                    <div class="search-row">
                        <div class="search-input-wrapper">
                            <label for="shop-name">お店の名前</label>
                            <input type="text" id="shop-name" placeholder="例：レストラン太郎、○○クリニック..." value="">
                        </div>
                        <div class="search-input-wrapper">
                            <label for="location">場所（住所またはエリア）</label>
                            <input type="text" id="location" placeholder="例：東京都渋谷区、大阪市北区..." value="">
                        </div>
                    </div>
                    <div class="search-row">
                        <div class="search-input-wrapper">
                            <label for="service-type">サービス種類</label>
                            <select id="service-type">
                                <option value="">すべて</option>
                                <option value="restaurant">飲食店</option>
                                <option value="beauty">美容</option>
                                <option value="hotel">ホテル</option>
                                <option value="education">教育</option>
                                <option value="medical">医療</option>
                                <option value="fitness">フィットネス</option>
                                <option value="entertainment">エンタメ</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="search-button">検索する</button>
                </form>
            </div>
        </section>

        <!-- カテゴリーセクション -->
        <section class="categories-section">
            <div class="categories-container">
                <h2 class="section-title">カテゴリーから探す</h2>
                <div class="categories-grid" id="categories-grid">
                    <a href="receptra-subcategories.html?category=restaurant" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-restaurant-B4-loarO.webp" type="image/webp">
                                <img src="/assets/category-restaurant-BAscIIQ-.jpg" alt="飲食店" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">飲食店</div>
                    </a>
                    <a href="receptra-subcategories.html?category=beauty" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-beauty-CRStQXfK.webp" type="image/webp">
                                <img src="/assets/category-beauty-DqEtsdqk.jpg" alt="美容" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">美容</div>
                    </a>
                    <a href="receptra-subcategories.html?category=hotel" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-hotel-CAC20cJ0.webp" type="image/webp">
                                <img src="/assets/category-hotel-BZf6FOW6.jpg" alt="ホテル" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">ホテル</div>
                    </a>
                    <a href="receptra-subcategories.html?category=education" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-education-Czl7OWni.webp" type="image/webp">
                                <img src="/assets/category-education-C-p_XweH.jpg" alt="教育" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">教育</div>
                    </a>
                    <a href="receptra-subcategories.html?category=medical" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-medical-BzzhBqyU.webp" type="image/webp">
                                <img src="/assets/category-medical-0TWJylor.jpg" alt="医療" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">医療</div>
                    </a>
                    <a href="receptra-subcategories.html?category=fitness" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-fitness-i5dv1GQw.webp" type="image/webp">
                                <img src="/assets/category-fitness-WI6WtEns.jpg" alt="フィットネス" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">フィットネス</div>
                    </a>
                    <a href="receptra-subcategories.html?category=entertainment" class="category-card">
                        <div class="category-icon">
                            <picture>
                                <source srcset="/assets/category-entertainment-BbUKLZC1.webp" type="image/webp">
                                <img src="/assets/category-entertainment-BlpDEeC7.jpg" alt="エンタメ" loading="lazy">
                            </picture>
                        </div>
                        <div class="category-name">エンタメ</div>
                    </a>
                    <a href="receptra-areas.html" class="category-card">
                        <div class="category-icon emoji-icon">📍</div>
                        <div class="category-name">エリアから</div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- フッター -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://www.bariyon.com/privacy.html" target="_blank">プライバシーポリシー</a>
                <a href="https://www.bariyon.com/terms.html" target="_blank">利用規約</a>
                <a href="https://www.bariyon.com/contact.html" target="_blank">お問い合わせ</a>
            </div>
            <div class="footer-copy">
                &copy; 2026 BARIYON レセプトラ. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        function scrollToSearch() {
            document.getElementById('search-section').scrollIntoView({ behavior: 'smooth' });
        }

        function goToSubcategories() {
            window.location.href = 'receptra-subcategories.html?category=restaurant';
        }

        function handleSearch(event) {
            event.preventDefault();
            const shopName = document.getElementById('shop-name').value;
            const location = document.getElementById('location').value;
            const serviceType = document.getElementById('service-type').value;

            // クエリパラメータで検索結果ページへ遷移
            const params = new URLSearchParams({
                shop: shopName,
                location: location,
                type: serviceType
            });

            // 実際の検索結果ページへ遷移
            // window.location.href = `receptra-results.html?${params.toString()}`;
            alert(`検索内容:\nお店:${shopName || 'すべて'}\n場所:${location || 'すべて'}\nサービス:${serviceType || 'すべて'}`);
        }
    </script>
</body>
</html>
