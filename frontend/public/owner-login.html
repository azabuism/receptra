<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗オーナーログイン - レセプトラ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35;
            --primary-light: #ff9500;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --error: #ef4444;
            --success: #10b981;
            --border: 1px solid #ddd;
        }
        html, body { height: 100%; }
        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        nav {
            background: var(--white);
            border-bottom: var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            height: 60px;
        }
        .nav-brand {
            text-decoration: none;
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
        }
        main {
            max-width: 440px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .badge {
            display: inline-block;
            background: #fff0e6;
            color: var(--primary-dark);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--dark);
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #666;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            background: var(--primary);
            color: var(--white);
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--primary-dark); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg {
            font-size: 13px;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
        }
        .msg.error { background: #fee2e2; color: var(--error); display: block; }
        .msg.success { background: #d1fae5; color: #047857; display: block; }
        .divider {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 8px 0 24px;
        }
        .switch-link {
            text-align: center;
            margin-top: 8px;
        }
        .switch-link a {
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }
        .switch-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">∞ レセプトラ</a>
    </nav>
    <main>
        <span class="badge">店舗オーナー様向け</span>
        <div class="card">
            <h2>店舗オーナーログイン</h2>
            <form id="login-form">
                <div class="field">
                    <label for="login-email">メールアドレス</label>
                    <input type="email" id="login-email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="login-password">パスワード</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="login-submit">ログイン</button>
                <div class="msg" id="login-msg"></div>
            </form>
        </div>

        <div class="divider">まだアカウントをお持ちでない方</div>

        <div class="card">
            <h2>新規登録（店舗オーナー様）</h2>
            <form id="register-form">
                <div class="field">
                    <label for="register-name">お名前</label>
                    <input type="text" id="register-name" required autocomplete="name">
                </div>
                <div class="field">
                    <label for="register-email">メールアドレス</label>
                    <input type="email" id="register-email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="register-password">パスワード（8文字以上）</label>
                    <input type="password" id="register-password" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-submit" id="register-submit">新規登録する</button>
                <div class="msg" id="register-msg"></div>
            </form>
        </div>

        <div class="switch-link">
            <a href="user-login.html">一般ユーザーの方はこちら →</a>
        </div>
    </main>

    <script>
        // すでにログイン済みのオーナーは店舗オーナーページへ
        if (localStorage.getItem('receptra_token')) {
            window.location.href = 'owner.html';
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg ' + type;
        }

        function saveSession(data) {
            localStorage.setItem('receptra_token', data.access_token);
            localStorage.setItem('receptra_user', JSON.stringify(data.user));
        }

        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const btn = document.getElementById('login-submit');
            const msg = document.getElementById('login-msg');
            msg.style.display = 'none';
            btn.disabled = true;
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'ログインに失敗しました');
                }
                saveSession(data);
                showMsg(msg, 'ログインしました。移動します…', 'success');
                window.location.href = 'owner.html';
            } catch (err) {
                showMsg(msg, err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const btn = document.getElementById('register-submit');
            const msg = document.getElementById('register-msg');
            msg.style.display = 'none';
            btn.disabled = true;
            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        display_name: document.getElementById('register-name').value,
                        email: document.getElementById('register-email').value,
                        password: document.getElementById('register-password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error((data.detail && (data.detail.msg || data.detail)) || '登録に失敗しました');
                }
                saveSession(data);
                showMsg(msg, '登録が完了しました。移動します…', 'success');
                window.location.href = 'owner.html';
            } catch (err) {
                showMsg(msg, typeof err.message === 'string' ? err.message : '登録に失敗しました', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
