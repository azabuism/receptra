<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗紹介 - レセプトラ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --rating-color: #fbbf24;
            --border: 1px solid #eee;
        }
        html, body { height: 100%; }
        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        nav {
            background: var(--white);
            border-bottom: var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            height: 60px;
        }
        .nav-brand {
            text-decoration: none;
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
        }
        .cover {
            width: 100%;
            aspect-ratio: 16 / 6;
            background: linear-gradient(135deg, #ffe0cc, #fff0e6);
            background-size: cover;
            background-position: center;
        }
        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }
        .header-block {
            background: var(--white);
            border-radius: 0 0 16px 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .category-badge {
            display: inline-block;
            background: #fff0e6;
            color: var(--primary-dark);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        h1 { font-size: 26px; margin-bottom: 8px; }
        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #777;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .stars { color: var(--rating-color); letter-spacing: 1px; }
        .cta-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .cta-row a {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }
        .cta-primary { background: var(--primary); color: var(--white); }
        .cta-primary:hover { background: var(--primary-dark); }
        .cta-secondary { background: var(--white); color: var(--primary); border: 2px solid var(--primary); }
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .card h2 {
            font-size: 17px;
            margin-bottom: 14px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }
        .info-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .info-table th {
            text-align: left;
            color: #888;
            font-weight: 700;
            padding: 10px 16px 10px 0;
            vertical-align: top;
            white-space: nowrap;
            width: 90px;
        }
        .info-table td { padding: 10px 0; border-top: 1px solid #f2f2f2; }
        .info-table tr:first-child td { border-top: none; }
        .hours-table { width: 100%; font-size: 13px; border-collapse: collapse; }
        .hours-table td { padding: 6px 10px; border-top: 1px solid #f2f2f2; }
        .hours-table td:first-child { font-weight: 700; width: 60px; }
        .closed-label { color: #bbb; }
        .description { font-size: 14px; white-space: pre-wrap; }
        #loading, #not-found { text-align: center; padding: 100px 20px; color: #999; }
        #not-found { display: none; }
        .feature-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .feature-tag {
            background: #f5f5f5; color: #555; font-size: 12px; font-weight: 700;
            padding: 5px 12px; border-radius: 14px;
        }
        .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .photo-gallery img {
            width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: pointer;
            background: #f0f0f0;
        }
        .gallery-kind-label { font-size: 12px; font-weight: 700; color: #888; margin: 14px 0 8px; }
        .gallery-kind-label:first-child { margin-top: 0; }
        .menu-category-title { font-size: 15px; font-weight: 700; color: var(--primary-dark); margin: 18px 0 10px; }
        .menu-category-title:first-child { margin-top: 0; }
        .menu-card-row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f2f2f2; }
        .menu-card-row:last-child { border-bottom: none; }
        .menu-card-row img { width: 76px; height: 76px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #f0f0f0; }
        .menu-card-info { flex: 1; min-width: 0; }
        .menu-card-info .mname { font-weight: 700; font-size: 15px; }
        .menu-card-info .mname.unavailable { color: #bbb; }
        .menu-card-info .mprice { font-size: 14px; color: var(--primary-dark); font-weight: 700; margin-top: 2px; }
        .menu-card-info .mdesc { font-size: 13px; color: #888; margin-top: 4px; }
        .sold-out-chip {
            display: inline-block; font-size: 11px; background: #eee; color: #999;
            padding: 2px 8px; border-radius: 10px; margin-left: 6px;
        }
        #map { width: 100%; height: 280px; border-radius: 12px; background: #eee; }
        .lightbox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .lightbox.open { display: flex; }
        .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
        .booking-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        @media (max-width: 560px) { .booking-row { grid-template-columns: 1fr; } }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 700; color: #555; margin-bottom: 6px; }
        .field input, .field textarea {
            width: 100%; padding: 10px 12px; border: var(--border); border-radius: 8px;
            font-size: 14px; font-family: inherit;
        }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
        .field textarea { resize: vertical; min-height: 60px; }
        .btn {
            padding: 11px 24px; border: none; border-radius: 22px; font-size: 14px; font-weight: 700;
            font-family: inherit; cursor: pointer; background: var(--primary); color: var(--white);
        }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .booking-slots { display: flex; flex-wrap: wrap; gap: 8px; }
        .slot-btn {
            padding: 8px 14px; border: 2px solid #eee; border-radius: 18px; background: var(--white);
            font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--dark);
        }
        .slot-btn:hover { border-color: var(--primary); color: var(--primary); }
        .slot-btn.selected { background: var(--primary); border-color: var(--primary); color: var(--white); }
        .slot-btn.unavailable { color: #ccc; border-color: #f0f0f0; cursor: not-allowed; text-decoration: line-through; }
        .booking-hint { font-size: 13px; color: #999; margin-bottom: 14px; }
        .booking-msg {
            font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none;
        }
        .booking-msg.error { background: #fee2e2; color: #ef4444; display: block; }
        .booking-msg.success { background: #d1fae5; color: #047857; display: block; }
        .booking-selected { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--primary-dark); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">∞ レセプトラ</a>
    </nav>

    <div id="loading">読み込み中…</div>
    <div id="not-found">
        <p>店舗が見つかりませんでした。</p>
    </div>

    <div id="content" style="display:none;">
        <div class="cover" id="cover"></div>
        <main>
            <div class="header-block">
                <div class="category-badge" id="category"></div>
                <h1 id="name"></h1>
                <div class="rating-row">
                    <span class="stars" id="stars"></span>
                    <span id="rating-text"></span>
                </div>
                <div class="feature-tags" id="feature-tags" style="display:none;"></div>
                <div class="cta-row">
                    <a href="#" class="cta-primary" id="call-btn">電話で問い合わせる</a>
                    <a href="#" class="cta-secondary" id="map-btn" target="_blank" rel="noopener">地図で見る</a>
                </div>
            </div>

            <div class="card" id="booking-card">
                <h2>ご予約</h2>
                <p class="booking-hint">会員登録は不要です。日時と人数を選んで、そのまま予約できます。</p>
                <div class="booking-row">
                    <div class="field" style="margin-bottom:0;">
                        <label for="booking-date">来店日</label>
                        <input type="date" id="booking-date">
                    </div>
                    <div class="field" style="margin-bottom:0;">
                        <label for="booking-party">人数</label>
                        <input type="number" id="booking-party" min="1" max="999" value="2">
                    </div>
                </div>
                <button type="button" class="btn" id="booking-check-btn">空き状況を確認</button>
                <div id="booking-slots-wrap" style="margin-top: 16px; display:none;">
                    <p class="booking-hint" id="booking-slots-hint" style="margin-bottom:10px;"></p>
                    <div class="booking-slots" id="booking-slots"></div>
                </div>
                <div id="booking-form-wrap" style="display:none; margin-top: 20px; padding-top: 18px; border-top: 1px solid #f0f0f0;">
                    <p class="booking-selected" id="booking-selected-label"></p>
                    <div class="field">
                        <label for="booking-name">お名前 *</label>
                        <input type="text" id="booking-name" required>
                    </div>
                    <div class="field">
                        <label for="booking-phone">電話番号 *</label>
                        <input type="tel" id="booking-phone" required>
                    </div>
                    <div class="field">
                        <label for="booking-email">メールアドレス</label>
                        <input type="email" id="booking-email">
                    </div>
                    <div class="field">
                        <label for="booking-notes">ご要望・備考</label>
                        <textarea id="booking-notes" placeholder="アレルギーや個室希望など"></textarea>
                    </div>
                    <button type="button" class="btn" id="booking-submit-btn">この内容で予約する</button>
                    <div class="booking-msg" id="booking-msg"></div>
                </div>
            </div>

            <div class="card" id="gallery-card" style="display:none;">
                <h2>写真</h2>
                <div id="gallery-content"></div>
            </div>

            <div class="card" id="description-card" style="display:none;">
                <h2>お店の紹介</h2>
                <p class="description" id="description"></p>
            </div>

            <div class="card" id="menu-card" style="display:none;">
                <h2>メニュー</h2>
                <div id="menu-content"></div>
            </div>

            <div class="card">
                <h2>基本情報</h2>
                <table class="info-table">
                    <tr><th>住所</th><td id="address"></td></tr>
                    <tr id="phone-row"><th>電話番号</th><td id="phone"></td></tr>
                    <tr id="website-row"><th>ウェブサイト</th><td><a id="website" target="_blank" rel="noopener"></a></td></tr>
                </table>
                <div id="map" style="margin-top: 16px;"></div>
            </div>

            <div class="card" id="hours-card" style="display:none;">
                <h2>営業時間</h2>
                <table class="hours-table" id="hours-table"></table>
            </div>
        </main>
    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const DAY_NAMES = ['月', '火', '水', '木', '金', '土', '日'];
        let currentShopId = null;
        let selectedBookingTime = null;
        const CATEGORY_LABELS = {
            RESTAURANT: '飲食店', CAFE: 'カフェ', RAMEN: 'ラーメン', SUSHI: '寿司',
            IZAKAYA: '居酒屋', BAR: 'バー', BEAUTY: '美容', SALON: 'サロン',
            CLINIC: 'クリニック', OTHER: 'その他'
        };

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        async function loadShop() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                showNotFound();
                return;
            }
            try {
                const res = await fetch('/api/v1/shops/' + encodeURIComponent(id));
                if (!res.ok) {
                    showNotFound();
                    return;
                }
                const shop = await res.json();
                render(shop);
            } catch (err) {
                showNotFound();
            }
        }

        function showNotFound() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('not-found').style.display = 'block';
        }

        function render(shop) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.title = shop.name + ' - レセプトラ';
            currentShopId = shop.id;

            const cover = shop.cover_image_url || shop.thumbnail_url;
            if (cover) {
                document.getElementById('cover').style.backgroundImage = "url('" + cover.replace(/'/g, '') + "')";
            }

            document.getElementById('category').textContent = CATEGORY_LABELS[shop.category] || shop.category;
            document.getElementById('name').textContent = shop.name;

            const rating = shop.average_rating || 0;
            const fullStars = Math.round(rating);
            document.getElementById('stars').textContent = '★★★★★'.slice(0, fullStars) + '☆☆☆☆☆'.slice(0, 5 - fullStars);
            document.getElementById('rating-text').textContent = rating > 0
                ? rating.toFixed(1) + '（' + (shop.total_reviews || 0) + '件のレビュー）'
                : 'レビューはまだありません';

            document.getElementById('address').textContent = shop.address;
            document.getElementById('map-btn').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(shop.address);

            if (shop.phone) {
                document.getElementById('phone').textContent = shop.phone;
                document.getElementById('call-btn').href = 'tel:' + shop.phone;
            } else {
                document.getElementById('phone-row').style.display = 'none';
                document.getElementById('call-btn').style.display = 'none';
            }

            if (shop.website) {
                document.getElementById('website').textContent = shop.website;
                document.getElementById('website').href = shop.website;
            } else {
                document.getElementById('website-row').style.display = 'none';
            }

            if (shop.description) {
                document.getElementById('description-card').style.display = 'block';
                document.getElementById('description').textContent = shop.description;
            }

            if (shop.features && shop.features.length > 0) {
                const tagsEl = document.getElementById('feature-tags');
                tagsEl.innerHTML = shop.features.map(function (f) {
                    return '<span class="feature-tag">' + escapeHtml(f) + '</span>';
                }).join('');
                tagsEl.style.display = 'flex';
            }

            if (shop.shop_hours && shop.shop_hours.length > 0) {
                const sorted = shop.shop_hours.slice().sort(function (a, b) { return a.day_of_week - b.day_of_week; });
                const rows = sorted.map(function (h) {
                    const label = h.is_closed
                        ? '<span class="closed-label">定休日</span>'
                        : escapeHtml(h.opening_time) + ' 〜 ' + escapeHtml(h.closing_time);
                    return '<tr><td>' + DAY_NAMES[h.day_of_week] + '曜</td><td>' + label + '</td></tr>';
                }).join('');
                document.getElementById('hours-table').innerHTML = rows;
                document.getElementById('hours-card').style.display = 'block';
            }

            loadGallery(shop.id);
            loadMenu(shop.id);
            initMap(shop);
        }

        // ---------- 写真ギャラリー ----------
        const GALLERY_KIND_LABELS = { exterior: '外観', interior: '内装', other: 'その他' };

        async function loadGallery(shopId) {
            try {
                const res = await fetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/photos');
                if (!res.ok) return;
                const photos = await res.json();
                if (!photos.length) return;

                const kinds = ['exterior', 'interior', 'other'];
                let html = '';
                kinds.forEach(function (kind) {
                    const items = photos.filter(function (p) { return p.kind === kind; })
                        .sort(function (a, b) { return a.display_order - b.display_order; });
                    if (!items.length) return;
                    html += '<div class="gallery-kind-label">' + GALLERY_KIND_LABELS[kind] + '</div>';
                    html += '<div class="photo-gallery">' + items.map(function (p) {
                        return '<img src="' + p.url + '" alt="" data-full="' + p.url + '">';
                    }).join('') + '</div>';
                });
                document.getElementById('gallery-content').innerHTML = html;
                document.getElementById('gallery-card').style.display = 'block';

                document.querySelectorAll('#gallery-content img').forEach(function (img) {
                    img.addEventListener('click', function () {
                        document.getElementById('lightbox-img').src = img.dataset.full;
                        document.getElementById('lightbox').classList.add('open');
                    });
                });
            } catch (err) {}
        }

        document.getElementById('lightbox').addEventListener('click', function () {
            this.classList.remove('open');
        });

        // ---------- メニュー ----------
        async function loadMenu(shopId) {
            try {
                const res = await fetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/menu');
                if (!res.ok) return;
                const items = await res.json();
                if (!items.length) return;

                const categories = [];
                items.forEach(function (i) { if (categories.indexOf(i.category) === -1) categories.push(i.category); });

                const html = categories.map(function (cat) {
                    const catItems = items.filter(function (i) { return i.category === cat; })
                        .sort(function (a, b) { return a.display_order - b.display_order; });
                    const rows = catItems.map(function (item) {
                        const img = item.photo_url ? '<img src="' + item.photo_url + '" alt="">' : '';
                        return '<div class="menu-card-row">' +
                            img +
                            '<div class="menu-card-info">' +
                                '<div class="mname' + (item.is_available ? '' : ' unavailable') + '">' +
                                    escapeHtml(item.name) +
                                    (item.is_available ? '' : '<span class="sold-out-chip">売り切れ</span>') +
                                '</div>' +
                                (item.price != null ? '<div class="mprice">¥' + item.price.toLocaleString() + '</div>' : '') +
                                (item.description ? '<div class="mdesc">' + escapeHtml(item.description) + '</div>' : '') +
                            '</div>' +
                        '</div>';
                    }).join('');
                    return '<div class="menu-category-title">' + escapeHtml(cat) + '</div>' + rows;
                }).join('');

                document.getElementById('menu-content').innerHTML = html;
                document.getElementById('menu-card').style.display = 'block';
            } catch (err) {}
        }

        // ---------- 地図 ----------
        async function initMap(shop) {
            const mapEl = document.getElementById('map');
            if (typeof L === 'undefined') return;

            let lat = shop.latitude;
            let lon = shop.longitude;

            if (lat == null || lon == null) {
                try {
                    const geoRes = await fetch(
                        'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(shop.address)
                    );
                    const results = await geoRes.json();
                    if (results && results.length > 0) {
                        lat = parseFloat(results[0].lat);
                        lon = parseFloat(results[0].lon);
                    }
                } catch (err) {
                    // 地図が出せなくても他の情報は表示できるようにする
                }
            }

            if (lat == null || lon == null) {
                mapEl.style.display = 'none';
                return;
            }

            const map = L.map(mapEl).setView([lat, lon], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 19
            }).addTo(map);
            L.marker([lat, lon]).addTo(map).bindPopup(escapeHtml(shop.name));
        }

        // ---------- ご予約 ----------
        (function initBookingDefaults() {
            const dateInput = document.getElementById('booking-date');
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = ('0' + (today.getMonth() + 1)).slice(-2);
            const dd = ('0' + today.getDate()).slice(-2);
            const todayStr = yyyy + '-' + mm + '-' + dd;
            dateInput.value = todayStr;
            dateInput.min = todayStr;
        })();

        function showBookingMsg(text, type) {
            const el = document.getElementById('booking-msg');
            el.textContent = text;
            el.className = 'booking-msg ' + type;
        }

        document.getElementById('booking-check-btn').addEventListener('click', async function () {
            if (!currentShopId) return;
            const date = document.getElementById('booking-date').value;
            const partySize = parseInt(document.getElementById('booking-party').value, 10) || 1;
            if (!date) {
                alert('来店日を選択してください');
                return;
            }

            const slotsWrap = document.getElementById('booking-slots-wrap');
            const slotsEl = document.getElementById('booking-slots');
            const hintEl = document.getElementById('booking-slots-hint');
            document.getElementById('booking-form-wrap').style.display = 'none';
            selectedBookingTime = null;

            slotsWrap.style.display = 'block';
            slotsEl.innerHTML = '';
            hintEl.textContent = '空き状況を確認しています…';

            try {
                const res = await fetch(
                    '/api/v1/reservations/shop/' + encodeURIComponent(currentShopId) +
                    '/availability?date=' + encodeURIComponent(date) + '&party_size=' + partySize
                );
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '空き状況の取得に失敗しました');

                if (!data.is_open) {
                    hintEl.textContent = data.message || 'この日は予約を受け付けていません';
                    slotsEl.innerHTML = '';
                    return;
                }
                if (!data.slots || data.slots.length === 0) {
                    hintEl.textContent = data.message || '本日は予約可能な時間がありません';
                    return;
                }

                hintEl.textContent = 'ご希望の時間を選んでください（空きがない時間はグレー表示です）';
                slotsEl.innerHTML = data.slots.map(function (s) {
                    const cls = s.available ? 'slot-btn' : 'slot-btn unavailable';
                    return '<button type="button" class="' + cls + '" data-time="' + s.time + '"' +
                        (s.available ? '' : ' disabled') + '>' + s.time + '</button>';
                }).join('');

                slotsEl.querySelectorAll('.slot-btn:not(.unavailable)').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        slotsEl.querySelectorAll('.slot-btn').forEach(function (b) { b.classList.remove('selected'); });
                        btn.classList.add('selected');
                        selectedBookingTime = btn.dataset.time;
                        document.getElementById('booking-selected-label').textContent =
                            date + ' ' + selectedBookingTime + '〜　' + partySize + '名';
                        document.getElementById('booking-form-wrap').style.display = 'block';
                        document.getElementById('booking-msg').className = 'booking-msg';
                    });
                });
            } catch (err) {
                hintEl.textContent = typeof err.message === 'string' ? err.message : '空き状況の取得に失敗しました';
            }
        });

        document.getElementById('booking-submit-btn').addEventListener('click', async function () {
            if (!currentShopId || !selectedBookingTime) return;
            const date = document.getElementById('booking-date').value;
            const partySize = parseInt(document.getElementById('booking-party').value, 10) || 1;
            const name = document.getElementById('booking-name').value.trim();
            const phone = document.getElementById('booking-phone').value.trim();
            const email = document.getElementById('booking-email').value.trim();
            const notes = document.getElementById('booking-notes').value.trim();

            if (!name || !phone) {
                showBookingMsg('お名前と電話番号を入力してください', 'error');
                return;
            }

            const reservationDate = date + 'T' + selectedBookingTime + ':00';
            const btn = document.getElementById('booking-submit-btn');
            btn.disabled = true;

            try {
                const res = await fetch('/api/v1/reservations/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        shop_id: currentShopId,
                        reservation_date: reservationDate,
                        number_of_people: partySize,
                        guest_name: name,
                        guest_phone: phone,
                        guest_email: email || null,
                        special_requests: notes || null
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '予約に失敗しました');

                showBookingMsg('ご予約ありがとうございます。' + data.message, 'success');
                document.getElementById('booking-slots-wrap').style.display = 'none';
                document.getElementById('booking-name').value = '';
                document.getElementById('booking-phone').value = '';
                document.getElementById('booking-email').value = '';
                document.getElementById('booking-notes').value = '';
                selectedBookingTime = null;
            } catch (err) {
                showBookingMsg(typeof err.message === 'string' ? err.message : '予約に失敗しました', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        loadShop();
    </script>
</body>
</html>
