<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗の管理 - レセプトラ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --error: #ef4444;
            --success: #10b981;
            --border: 1px solid #ddd;
        }
        html, body { height: 100%; }
        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        nav {
            background: var(--white);
            border-bottom: var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .nav-brand { text-decoration: none; color: var(--primary); font-size: 20px; font-weight: 700; }
        .nav-right { display: flex; align-items: center; gap: 14px; font-size: 14px; }
        .nav-right a { color: var(--dark); text-decoration: none; font-size: 13px; }
        main { max-width: 820px; margin: 0 auto; padding: 32px 20px 100px; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .subtitle { color: #777; font-size: 14px; margin-bottom: 24px; }
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 22px;
        }
        .card h2 { font-size: 17px; margin-bottom: 6px; }
        .card .hint { font-size: 12px; color: #999; margin-bottom: 16px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #666; }
        .field input, .field select, .field textarea {
            width: 100%; padding: 10px 12px; border: 2px solid #eee; border-radius: 8px;
            font-size: 14px; font-family: inherit;
        }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
        .field textarea { resize: vertical; min-height: 60px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 560px) { .row-3, .row-2 { grid-template-columns: 1fr; } }
        .btn {
            padding: 10px 22px; border: none; border-radius: 20px; font-size: 14px; font-weight: 700;
            font-family: inherit; cursor: pointer; background: var(--primary); color: var(--white);
        }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-outline {
            background: none; border: 2px solid #eee; color: var(--dark);
            padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { color: var(--error); }
        .btn-danger:hover { border-color: var(--error); }
        .msg {
            font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none;
        }
        .msg.error { background: #fee2e2; color: var(--error); display: block; }
        .msg.success { background: #d1fae5; color: #047857; display: block; }
        .kind-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .kind-tab {
            padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 700;
            background: #f0f0f0; color: #888;
        }
        .kind-tab.active { background: #fff0e6; color: var(--primary-dark); }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .photo-item { position: relative; border-radius: 10px; overflow: hidden; background: #f0f0f0; aspect-ratio: 1; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-actions {
            position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 4px;
            padding: 4px; background: rgba(0,0,0,0.45);
        }
        .photo-actions button {
            background: rgba(255,255,255,0.9); border: none; border-radius: 4px; font-size: 11px;
            padding: 3px 6px; cursor: pointer;
        }
        .empty-state { color: #999; font-size: 13px; padding: 10px 0; }
        .menu-category-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin: 18px 0 8px; }
        .menu-category-title:first-child { margin-top: 0; }
        .menu-row {
            display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0;
        }
        .menu-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #f0f0f0; flex-shrink: 0; }
        .menu-info { flex: 1; min-width: 0; }
        .menu-info .name { font-weight: 700; font-size: 14px; }
        .menu-info .name.unavailable { color: #bbb; text-decoration: line-through; }
        .menu-info .price { font-size: 13px; color: var(--primary-dark); font-weight: 700; }
        .menu-info .desc { font-size: 12px; color: #888; }
        .menu-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
        .sold-out-badge { font-size: 11px; background: #eee; color: #999; padding: 2px 8px; border-radius: 10px; }
        #gate { display: none; text-align: center; padding: 80px 20px; color: #888; }
        label.checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; color: var(--dark); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">∞ レセプトラ</a>
        <div class="nav-right">
            <a href="owner.html">← オーナーページに戻る</a>
        </div>
    </nav>
    <main id="app" style="display: none;">
        <h1 id="shop-name-title">店舗の管理</h1>
        <p class="subtitle">お店の基本情報・写真・メニュー・特徴を編集できます。</p>

        <div class="card">
            <h2>基本情報</h2>
            <form id="basic-form">
                <div class="field">
                    <label for="edit-name">店舗名 *</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="row-2">
                    <div class="field">
                        <label for="edit-category">カテゴリ *</label>
                        <select id="edit-category" required>
                            <option value="RESTAURANT">飲食店</option>
                            <option value="CAFE">カフェ</option>
                            <option value="RAMEN">ラーメン</option>
                            <option value="SUSHI">寿司</option>
                            <option value="IZAKAYA">居酒屋</option>
                            <option value="BAR">バー</option>
                            <option value="BEAUTY">美容</option>
                            <option value="SALON">サロン</option>
                            <option value="CLINIC">クリニック</option>
                            <option value="OTHER">その他</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="edit-phone">電話番号</label>
                        <input type="tel" id="edit-phone">
                    </div>
                </div>
                <div class="field">
                    <label for="edit-address">住所 *</label>
                    <input type="text" id="edit-address" required>
                </div>
                <div class="row-2">
                    <div class="field">
                        <label for="edit-email">連絡先メールアドレス</label>
                        <input type="email" id="edit-email">
                    </div>
                    <div class="field">
                        <label for="edit-website">ウェブサイトURL</label>
                        <input type="url" id="edit-website" placeholder="https://">
                    </div>
                </div>
                <div class="row-2">
                    <div class="field">
                        <label for="edit-thumbnail">サムネイル画像URL</label>
                        <input type="url" id="edit-thumbnail" placeholder="https://">
                    </div>
                    <div class="field">
                        <label for="edit-cover">カバー画像URL</label>
                        <input type="url" id="edit-cover" placeholder="https://">
                    </div>
                </div>
                <div class="field">
                    <label for="edit-description">お店の紹介文</label>
                    <textarea id="edit-description"></textarea>
                </div>
                <button type="submit" class="btn" id="basic-save-btn">保存する</button>
                <div class="msg" id="basic-msg"></div>
            </form>
        </div>

        <div class="card">
            <h2>お店の特徴</h2>
            <p class="hint">来店の決め手になるポイントをタグとして表示します（カンマ区切り）</p>
            <div class="field">
                <input type="text" id="features-input" placeholder="例：個室あり, 禁煙, 駐車場あり">
            </div>
            <button class="btn" id="features-save">保存する</button>
            <div class="msg" id="features-msg"></div>
        </div>

        <div class="card">
            <h2>外観・内装の写真</h2>
            <p class="hint">お店の雰囲気が伝わる写真を追加しましょう</p>
            <form id="photo-form">
                <div class="row-2">
                    <div class="field">
                        <label for="photo-kind">写真の種類</label>
                        <select id="photo-kind">
                            <option value="exterior">外観</option>
                            <option value="interior">内装</option>
                            <option value="other">その他</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="photo-file">画像ファイル</label>
                        <input type="file" id="photo-file" accept="image/*" required>
                    </div>
                </div>
                <button type="submit" class="btn" id="photo-upload-btn">アップロード</button>
                <div class="msg" id="photo-msg"></div>
            </form>
            <div id="photo-sections" style="margin-top: 18px;"></div>
        </div>

        <div class="card">
            <h2>メニュー</h2>
            <p class="hint">価格や写真つきでメニューを紹介できます</p>
            <form id="menu-form">
                <div class="row-2">
                    <div class="field">
                        <label for="menu-category">カテゴリ</label>
                        <input type="text" id="menu-category" placeholder="例：フード、ドリンク" value="フード">
                    </div>
                    <div class="field">
                        <label for="menu-name">商品名 *</label>
                        <input type="text" id="menu-name" required>
                    </div>
                </div>
                <div class="row-2">
                    <div class="field">
                        <label for="menu-price">価格（円）</label>
                        <input type="number" id="menu-price" min="0">
                    </div>
                    <div class="field">
                        <label for="menu-file">写真</label>
                        <input type="file" id="menu-file" accept="image/*">
                    </div>
                </div>
                <div class="field">
                    <label for="menu-description">説明</label>
                    <textarea id="menu-description" placeholder="こだわりや食材などを紹介"></textarea>
                </div>
                <button type="submit" class="btn" id="menu-add-btn">メニューに追加</button>
                <div class="msg" id="menu-msg"></div>
            </form>
            <div id="menu-list" style="margin-top: 18px;"></div>
        </div>

        <div class="card">
            <h2>店舗の削除</h2>
            <p class="hint">この店舗と、登録されている写真・メニュー・営業時間などをすべて削除します。この操作は取り消せません。</p>
            <button type="button" class="btn-outline btn-danger" id="delete-shop-btn">この店舗を削除する</button>
            <div class="msg" id="delete-msg"></div>
        </div>
    </main>
    <div id="gate">
        <p>ログインが必要です。移動します…</p>
    </div>

    <script>
        const token = localStorage.getItem('receptra_token');
        const params = new URLSearchParams(window.location.search);
        const shopId = params.get('id');
        const KIND_LABELS = { exterior: '外観', interior: '内装', other: 'その他' };

        if (!token || !shopId) {
            document.getElementById('gate').style.display = 'block';
            window.location.href = 'owner-login.html';
        } else {
            document.getElementById('app').style.display = 'block';
            init();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg ' + type;
            el.style.display = 'block';
        }

        async function authFetch(url, options) {
            options = options || {};
            options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token });
            const res = await fetch(url, options);
            if (res.status === 401) {
                localStorage.removeItem('receptra_token');
                localStorage.removeItem('receptra_user');
                window.location.href = 'owner-login.html';
                throw new Error('認証切れ');
            }
            return res;
        }

        async function init() {
            try {
                const res = await fetch('/api/v1/shops/' + encodeURIComponent(shopId));
                if (res.ok) {
                    const shop = await res.json();
                    document.getElementById('shop-name-title').textContent = shop.name + ' の管理';
                    document.getElementById('features-input').value = (shop.features || []).join(', ');

                    document.getElementById('edit-name').value = shop.name || '';
                    document.getElementById('edit-category').value = shop.category || 'OTHER';
                    document.getElementById('edit-phone').value = shop.phone || '';
                    document.getElementById('edit-address').value = shop.address || '';
                    document.getElementById('edit-email').value = shop.email || '';
                    document.getElementById('edit-website').value = shop.website || '';
                    document.getElementById('edit-thumbnail').value = shop.thumbnail_url || '';
                    document.getElementById('edit-cover').value = shop.cover_image_url || '';
                    document.getElementById('edit-description').value = shop.description || '';
                }
            } catch (e) {}
            loadPhotos();
            loadMenu();
        }

        // ---------- 基本情報 ----------
        document.getElementById('basic-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const msg = document.getElementById('basic-msg');
            const btn = document.getElementById('basic-save-btn');
            const payload = {
                name: document.getElementById('edit-name').value.trim(),
                category: document.getElementById('edit-category').value,
                phone: document.getElementById('edit-phone').value.trim() || null,
                address: document.getElementById('edit-address').value.trim(),
                email: document.getElementById('edit-email').value.trim() || null,
                website: document.getElementById('edit-website').value.trim() || null,
                thumbnail_url: document.getElementById('edit-thumbnail').value.trim() || null,
                cover_image_url: document.getElementById('edit-cover').value.trim() || null,
                description: document.getElementById('edit-description').value.trim() || null
            };
            btn.disabled = true;
            try {
                const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errData = await res.json().catch(function () { return {}; });
                    throw new Error(errData.detail || '保存に失敗しました');
                }
                const shop = await res.json();
                document.getElementById('shop-name-title').textContent = shop.name + ' の管理';
                showMsg(msg, '保存しました', 'success');
            } catch (err) {
                showMsg(msg, typeof err.message === 'string' ? err.message : '保存に失敗しました', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        // ---------- 特徴 ----------
        document.getElementById('features-save').addEventListener('click', async function () {
            const msg = document.getElementById('features-msg');
            const features = document.getElementById('features-input').value
                .split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
            try {
                const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features: features })
                });
                if (!res.ok) throw new Error('保存に失敗しました');
                showMsg(msg, '保存しました', 'success');
            } catch (err) {
                showMsg(msg, err.message || '保存に失敗しました', 'error');
            }
        });

        // ---------- 写真 ----------
        async function loadPhotos() {
            const container = document.getElementById('photo-sections');
            try {
                const res = await fetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/photos');
                const photos = await res.json();
                const kinds = ['exterior', 'interior', 'other'];
                container.innerHTML = kinds.map(function (kind) {
                    const items = photos.filter(function (p) { return p.kind === kind; })
                        .sort(function (a, b) { return a.display_order - b.display_order; });
                    const grid = items.length
                        ? items.map(function (p, idx) {
                            return '<div class="photo-item">' +
                                '<img src="' + p.url + '" alt="">' +
                                '<div class="photo-actions">' +
                                    (idx > 0 ? '<button data-action="up" data-id="' + p.id + '" data-kind="' + kind + '">↑</button>' : '') +
                                    (idx < items.length - 1 ? '<button data-action="down" data-id="' + p.id + '" data-kind="' + kind + '">↓</button>' : '') +
                                    '<button data-action="delete" data-id="' + p.id + '">削除</button>' +
                                '</div>' +
                            '</div>';
                        }).join('')
                        : '<div class="empty-state">まだ写真がありません</div>';
                    return '<div class="kind-tabs"><span class="kind-tab active">' + KIND_LABELS[kind] + '</span></div>' +
                        '<div class="photo-grid">' + grid + '</div>';
                }).join('');

                container.querySelectorAll('button[data-action]').forEach(function (btn) {
                    btn.addEventListener('click', function () { handlePhotoAction(btn, photos); });
                });
            } catch (err) {
                container.innerHTML = '<div class="empty-state">読み込みに失敗しました</div>';
            }
        }

        async function handlePhotoAction(btn, photos) {
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const msg = document.getElementById('photo-msg');
            try {
                if (action === 'delete') {
                    if (!confirm('この写真を削除しますか？')) return;
                    const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/photos/' + encodeURIComponent(id), { method: 'DELETE' });
                    if (!res.ok) throw new Error('削除に失敗しました');
                } else {
                    const kind = btn.dataset.kind;
                    const items = photos.filter(function (p) { return p.kind === kind; })
                        .sort(function (a, b) { return a.display_order - b.display_order; });
                    const idx = items.findIndex(function (p) { return p.id === id; });
                    const swapIdx = action === 'up' ? idx - 1 : idx + 1;
                    if (swapIdx < 0 || swapIdx >= items.length) return;
                    const a = items[idx], b = items[swapIdx];
                    const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/photos/reorder', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: [{ id: a.id, display_order: b.display_order }, { id: b.id, display_order: a.display_order }] })
                    });
                    if (!res.ok) throw new Error('並び替えに失敗しました');
                }
                loadPhotos();
            } catch (err) {
                showMsg(msg, err.message || '操作に失敗しました', 'error');
            }
        }

        document.getElementById('photo-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const btn = document.getElementById('photo-upload-btn');
            const msg = document.getElementById('photo-msg');
            msg.style.display = 'none';
            const fileInput = document.getElementById('photo-file');
            if (!fileInput.files.length) return;
            btn.disabled = true;
            try {
                const formData = new FormData();
                formData.append('kind', document.getElementById('photo-kind').value);
                formData.append('file', fileInput.files[0]);
                const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/photos', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error((data.detail && (data.detail.msg || data.detail)) || 'アップロードに失敗しました');
                showMsg(msg, 'アップロードしました', 'success');
                document.getElementById('photo-form').reset();
                loadPhotos();
            } catch (err) {
                showMsg(msg, typeof err.message === 'string' ? err.message : 'アップロードに失敗しました', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        // ---------- メニュー ----------
        async function loadMenu() {
            const container = document.getElementById('menu-list');
            try {
                const res = await fetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/menu');
                const items = await res.json();
                if (!items.length) {
                    container.innerHTML = '<div class="empty-state">まだメニューがありません</div>';
                    return;
                }
                const categories = [];
                items.forEach(function (i) { if (categories.indexOf(i.category) === -1) categories.push(i.category); });

                container.innerHTML = categories.map(function (cat) {
                    const catItems = items.filter(function (i) { return i.category === cat; })
                        .sort(function (a, b) { return a.display_order - b.display_order; });
                    const rows = catItems.map(function (item, idx) {
                        const thumb = item.photo_url
                            ? '<img class="menu-thumb" src="' + item.photo_url + '" alt="">'
                            : '<div class="menu-thumb"></div>';
                        return '<div class="menu-row">' +
                            thumb +
                            '<div class="menu-info">' +
                                '<div class="name' + (item.is_available ? '' : ' unavailable') + '">' + escapeHtml(item.name) + '</div>' +
                                (item.price != null ? '<div class="price">¥' + item.price.toLocaleString() + '</div>' : '') +
                                (item.description ? '<div class="desc">' + escapeHtml(item.description) + '</div>' : '') +
                            '</div>' +
                            '<div class="menu-controls">' +
                                (!item.is_available ? '<span class="sold-out-badge">売り切れ中</span>' : '') +
                                '<button class="btn-outline" data-action="toggle" data-id="' + item.id + '" data-available="' + item.is_available + '">' +
                                    (item.is_available ? '売り切れにする' : '販売再開') +
                                '</button>' +
                                (idx > 0 ? '<button class="btn-outline" data-action="up" data-id="' + item.id + '" data-cat="' + escapeHtml(cat) + '">↑</button>' : '') +
                                (idx < catItems.length - 1 ? '<button class="btn-outline" data-action="down" data-id="' + item.id + '" data-cat="' + escapeHtml(cat) + '">↓</button>' : '') +
                                '<button class="btn-outline btn-danger" data-action="delete" data-id="' + item.id + '">削除</button>' +
                            '</div>' +
                        '</div>';
                    }).join('');
                    return '<div class="menu-category-title">' + escapeHtml(cat) + '</div>' + rows;
                }).join('');

                container.querySelectorAll('button[data-action]').forEach(function (btn) {
                    btn.addEventListener('click', function () { handleMenuAction(btn, items); });
                });
            } catch (err) {
                container.innerHTML = '<div class="empty-state">読み込みに失敗しました</div>';
            }
        }

        async function handleMenuAction(btn, items) {
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const msg = document.getElementById('menu-msg');
            try {
                if (action === 'delete') {
                    if (!confirm('このメニュー項目を削除しますか？')) return;
                    const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/menu/' + encodeURIComponent(id), { method: 'DELETE' });
                    if (!res.ok) throw new Error('削除に失敗しました');
                } else if (action === 'toggle') {
                    const nowAvailable = btn.dataset.available === 'true';
                    const formData = new FormData();
                    formData.append('is_available', (!nowAvailable).toString());
                    const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/menu/' + encodeURIComponent(id), {
                        method: 'PUT', body: formData
                    });
                    if (!res.ok) throw new Error('更新に失敗しました');
                } else {
                    const cat = btn.dataset.cat;
                    const catItems = items.filter(function (i) { return i.category === cat; })
                        .sort(function (a, b) { return a.display_order - b.display_order; });
                    const idx = catItems.findIndex(function (i) { return i.id === id; });
                    const swapIdx = action === 'up' ? idx - 1 : idx + 1;
                    if (swapIdx < 0 || swapIdx >= catItems.length) return;
                    const a = catItems[idx], b = catItems[swapIdx];
                    const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/menu/reorder', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items: [{ id: a.id, display_order: b.display_order }, { id: b.id, display_order: a.display_order }] })
                    });
                    if (!res.ok) throw new Error('並び替えに失敗しました');
                }
                loadMenu();
            } catch (err) {
                showMsg(msg, err.message || '操作に失敗しました', 'error');
            }
        }

        document.getElementById('menu-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const btn = document.getElementById('menu-add-btn');
            const msg = document.getElementById('menu-msg');
            msg.style.display = 'none';
            btn.disabled = true;
            try {
                const formData = new FormData();
                formData.append('category', document.getElementById('menu-category').value || 'その他');
                formData.append('name', document.getElementById('menu-name').value);
                const price = document.getElementById('menu-price').value;
                if (price) formData.append('price', price);
                const desc = document.getElementById('menu-description').value;
                if (desc) formData.append('description', desc);
                const fileInput = document.getElementById('menu-file');
                if (fileInput.files.length) formData.append('file', fileInput.files[0]);

                const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/menu', {
                    method: 'POST', body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error((data.detail && (data.detail.msg || data.detail)) || '追加に失敗しました');
                showMsg(msg, 'メニューに追加しました', 'success');
                document.getElementById('menu-form').reset();
                document.getElementById('menu-category').value = 'フード';
                loadMenu();
            } catch (err) {
                showMsg(msg, typeof err.message === 'string' ? err.message : '追加に失敗しました', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        // ---------- 店舗削除 ----------
        document.getElementById('delete-shop-btn').addEventListener('click', async function () {
            const msg = document.getElementById('delete-msg');
            const nameEl = document.getElementById('shop-name-title');
            const shopName = (nameEl.textContent || '').replace(/ の管理$/, '');
            if (!confirm('「' + shopName + '」を削除します。写真・メニューなどもすべて削除され、元に戻せません。よろしいですか？')) {
                return;
            }
            const btn = document.getElementById('delete-shop-btn');
            btn.disabled = true;
            try {
                const res = await authFetch('/api/v1/shops/' + encodeURIComponent(shopId), { method: 'DELETE' });
                if (!res.ok) {
                    const errData = await res.json().catch(function () { return {}; });
                    throw new Error(errData.detail || '削除に失敗しました');
                }
                window.location.href = 'owner.html';
            } catch (err) {
                showMsg(msg, typeof err.message === 'string' ? err.message : '削除に失敗しました', 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
