<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIでご予約 - レセプトラ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35;
            --primary-light: #ff9500;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --error: #ef4444;
            --success: #10b981;
            --border: 1px solid #ddd;
        }
        html, body { height: 100%; overflow-x: hidden; max-width: 100%; }
        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--white);
            border-bottom: var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header a.back {
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
        header .titles h1 {
            font-size: 16px;
            color: var(--primary);
        }
        header .titles .sub {
            font-size: 12px;
            color: #888;
        }
        .mode-badge {
            margin-left: auto;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            background: #fff1e6;
            color: var(--primary-dark);
            font-weight: 700;
            white-space: nowrap;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        #loading, #not-found {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        #chatWindow {
            flex: 1;
            min-height: 340px;
            max-height: 58vh;
            overflow-y: auto;
            background: var(--white);
            border: var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .bubble.caller {
            align-self: flex-end;
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.ai {
            align-self: flex-start;
            background: var(--light);
            color: var(--dark);
            border-bottom-left-radius: 4px;
        }
        .bubble.system {
            align-self: center;
            font-size: 12px;
            color: #b91c1c;
            background: #fee2e2;
            border-radius: 8px;
        }
        .ended-banner {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
        }
        form#inputForm {
            display: flex;
            gap: 8px;
        }
        form#inputForm input[type=text] {
            flex: 1;
            font-family: inherit;
            font-size: 14px;
            padding: 10px 12px;
            border: var(--border);
            border-radius: 8px;
        }
        button {
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #eee; color: var(--dark); }
        .btn-secondary:hover { background: #ddd; }
        button:disabled { opacity: 0.5; cursor: default; }
        .mic-btn {
            background: var(--white);
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            padding: 0;
            flex-shrink: 0;
        }
        .mic-btn.listening {
            background: var(--error);
            border-color: var(--error);
            color: #fff;
            animation: pulse 1s infinite;
        }
        .mic-btn.speaking {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: #fff;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
            50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
        }
        #voiceStatus, #startCallHint {
            font-size: 12px;
            color: var(--primary);
            min-height: 16px;
            text-align: center;
        }
        #startCallHint { font-size: 14px; font-weight: 700; margin-top: 4px; }
        .voice-hero {
            text-align: center;
            padding: 30px 10px 6px;
        }
        .voice-hero .big-mic {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            background: var(--white);
            color: var(--primary);
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .voice-hero .big-mic.listening {
            background: var(--error);
            border-color: var(--error);
            color: #fff;
            animation: pulse 1s infinite;
        }
        .voice-hero .big-mic.speaking {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: #fff;
        }
        footer {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            padding: 12px;
        }
        @media (max-width: 480px) {
            header .titles h1 { font-size: 15px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="back" href="#" id="backLink">← 店舗ページに戻る</a>
        <div class="titles">
            <h1 id="pageShopName">AIでご予約</h1>
            <div class="sub">レセプトラ AI予約受付</div>
        </div>
        <span class="mode-badge" id="modeBadge">チャットで予約</span>
    </header>

    <div id="loading" class="container">読み込み中…</div>
    <div id="not-found" class="container" style="display:none;">店舗が見つかりませんでした。</div>

    <div class="container" id="startCallScreen" style="display:none;">
        <div class="voice-hero">
            <button type="button" class="big-mic" id="startCallBtn">📞</button>
            <div id="startCallHint">タップして通話を開始してください</div>
        </div>
    </div>

    <div class="container" id="content" style="display:none;">
        <div class="voice-hero" id="voiceHero" style="display:none;">
            <button type="button" class="big-mic" id="bigMicBtn">🎤</button>
            <div id="voiceStatus"></div>
        </div>

        <div id="chatWindow"></div>

        <form id="inputForm">
            <button class="mic-btn" id="micBtn" type="button" title="話す">🎤</button>
            <input type="text" id="messageInput" placeholder="ご希望の日時・人数・お名前などを入力..." autocomplete="off" />
            <button class="btn-primary" type="submit">送信</button>
        </form>
    </div>

    <footer>RECEPTRA AI予約受付（会員登録不要）</footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const shopId = params.get('id');
        const mode = params.get('mode') === 'voice' ? 'voice' : 'chat';

        document.getElementById('backLink').href = shopId ? ('/shop.html?id=' + encodeURIComponent(shopId)) : '/';
        document.getElementById('modeBadge').textContent = mode === 'voice' ? '通話で予約' : 'チャットで予約';

        const loadingEl = document.getElementById('loading');
        const notFoundEl = document.getElementById('not-found');
        const startCallScreenEl = document.getElementById('startCallScreen');
        const startCallBtn = document.getElementById('startCallBtn');
        const contentEl = document.getElementById('content');
        const chatWindow = document.getElementById('chatWindow');
        const inputForm = document.getElementById('inputForm');
        const messageInput = document.getElementById('messageInput');
        const micBtn = document.getElementById('micBtn');
        const voiceHero = document.getElementById('voiceHero');
        const bigMicBtn = document.getElementById('bigMicBtn');
        const voiceStatus = document.getElementById('voiceStatus');
        const pageShopName = document.getElementById('pageShopName');

        let sessionId = null;
        let ended = false;

        if (!shopId) {
            loadingEl.style.display = 'none';
            notFoundEl.style.display = 'block';
            throw new Error('shop id missing');
        }

        if (mode === 'voice') {
            voiceHero.style.display = 'block';
        }

        // 通話モードはスマホのブラウザ(特にiOS Safari)では、ユーザーの
        // タップ操作なしに音声合成(読み上げ)やマイクを起動できないため、
        // 「通話を開始する」ボタンのタップを起点にする。これによりAIの
        // 最初の挨拶も声で流れるようになる。チャットモードは即開始でよい。
        if (mode === 'voice') {
            loadingEl.style.display = 'none';
            startCallScreenEl.style.display = 'flex';

            const beginCall = () => {
                if (startCallBtn.disabled) return;
                startCallBtn.disabled = true;
                document.getElementById('startCallHint').textContent = '接続しています…';
                startCallScreenEl.style.display = 'none';
                contentEl.style.display = 'flex';
                startSession();
            };
            startCallBtn.addEventListener('click', beginCall, { once: true });

            // 店舗ページで「通話で予約」をタップした操作(ユーザー操作)は、
            // 別ページへの遷移をまたぐとブラウザによっては引き継がれない
            // （特にiOS Safariは、音声合成やマイク起動のために、遷移後の
            // ページ内で改めてユーザー操作を要求する）。そのため従来は
            // 常にこの画面でもう一度タップを求めていた。
            // ここでは無音のSpeechRecognitionを試しに起動してみて、
            // ユーザー操作なしでも起動できる環境（Android Chrome等、
            // 前の操作が引き継がれるブラウザ）であれば、そのまま自動で
            // 通話を開始する。起動できない環境（iOS Safari等）では
            // このお試し起動が静かに失敗するだけなので、その場合は
            // 従来通り「📞 タップして通話を開始してください」のまま
            // 手動タップを待つ（動作が壊れることはない）。
            if (SpeechRecognitionCtor) {
                try {
                    const probe = new SpeechRecognitionCtor();
                    probe.lang = 'ja-JP';
                    let probeStarted = false;
                    probe.onstart = () => { probeStarted = true; try { probe.stop(); } catch (e) {} };
                    probe.onerror = () => {};
                    probe.onend = () => { if (probeStarted) beginCall(); };
                    probe.start();
                } catch (e) { /* 起動できない場合は何もせず、手動タップを待つ */ }
            }
        }

        // ===== 音声認識(マイク入力) =====
        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognizer = null;
        let listening = false;

        function setListeningUI(on) {
            listening = on;
            micBtn.classList.toggle('listening', on);
            bigMicBtn.classList.toggle('listening', on);
        }

        if (SpeechRecognitionCtor) {
            const SILENCE_MS = 1600;   // 発話が始まった"後"に、この時間だけ間が空いたら聞き取り終了とみなす
            const MAX_LISTEN_MS = 20000; // お客様がまだ何も話していない場合に、話し始めるのを待つ上限（考える時間の猶予）
            let silenceTimer = null;
            let hardStopTimer = null;
            let lastRecognitionError = null;
            let autoRetryBudget = 0;

            function clearAutoStopTimers() {
                clearTimeout(silenceTimer);
                clearTimeout(hardStopTimer);
            }
            function scheduleSilenceStop(rec) {
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    try { rec.stop(); } catch (e) {}
                }, SILENCE_MS);
            }

            // 重要: 1ターンごとに必ず新しいSpeechRecognitionインスタンスを
            // 作り直す。以前は1つのインスタンスをstart/stopで使い回して
            // いたが、iOS Safari等では2回目以降のstart()で「onstartは
            // 発火してonendも普通に終わるのに、実際の音声はまったく
            // 認識されない（onresultが一切発生しない）」という不具合が
            // 報告された（1回目の発話だけ認識され、2回目以降は
            // 「🎤 聞いています...」のまま何も認識されなくなる）。
            // これはWebKit系ブラウザで知られている挙動で、インスタンスを
            // 毎回作り直すことで回避できる。
            function createRecognizer() {
                const rec = new SpeechRecognitionCtor();
                rec.lang = 'ja-JP';
                rec.interimResults = true;
                // ブラウザ(特にiOS Safari)側の「発話終了」自動判定は精度がまちまちで、
                // 話し終えてもボタンを押すまで認識が終わらないことがある。実際の電話回線
                // (Vonage側)では無音1.5秒程度でこちらから聞き取りを打ち切っているのと同様に、
                // ここでも認識結果イベントを基準に無音タイマーを独自に持たせ、自動で
                // rec.stop() を呼ぶことで、ボタン操作なしでターンが進むようにする。
                rec.continuous = true;

                rec.onstart = () => {
                    setListeningUI(true);
                    voiceStatus.textContent = '🎤 聞いています...';
                    // 重要: ここでSILENCE_MS(1.6秒)の無音タイマーを即座に仕掛けてはいけない。
                    // AIの読み上げ直後、お客様が話し始めるまでに1.6秒以上「考える間」が
                    // 空くのはごく普通のことだが、以前はここで発話後の無音判定と同じ
                    // タイマーを使っていたため、お客様がまだ一言も話していないのに
                    // 聞き取りが打ち切られ、マイクが無反応になって見えるバグがあった
                    // （「話しかけても返ってこない」の主因）。
                    // そのため、発話が始まるまではMAX_LISTEN_MSという長めの猶予だけを設け、
                    // 実際に音声(onresult)を受け取ってから初めてSILENCE_MSの
                    // トレーリング無音判定を開始する。
                    hardStopTimer = setTimeout(() => { try { rec.stop(); } catch (e) {} }, MAX_LISTEN_MS);
                };
                rec.onresult = (ev) => {
                    let transcript = '';
                    for (let i = 0; i < ev.results.length; i++) {
                        transcript += ev.results[i][0].transcript;
                    }
                    messageInput.value = transcript;
                    if (ev.results[ev.results.length - 1].isFinal) {
                        voiceStatus.textContent = '認識結果: 「' + transcript + '」';
                    }
                    // 実際に発話を受け取った後だけ、トレーリング無音タイマーを開始/更新する
                    scheduleSilenceStop(rec);
                };
                // iOS Safari等では、AIの読み上げ(TTS)直後にマイクを再開しようとすると
                // オーディオセッションの切り替えが間に合わず "aborted" エラーで
                // 認識が即座に終了してしまうことがある。これはユーザー操作ではなく
                // 一時的な競合によるものなので、自動再開の際は数回だけ静かに
                // 再試行してから、それでもダメな場合だけ手動タップを促す。
                rec.onerror = (ev) => {
                    lastRecognitionError = ev.error;
                    if (ev.error === 'no-speech' || ev.error === 'aborted') {
                        // 'aborted' の案内はonend側でリトライ判定した上で出す
                        return;
                    }
                    voiceStatus.textContent = '音声認識エラー: ' + ev.error;
                };
                rec.onend = () => {
                    clearAutoStopTimers();
                    setListeningUI(false);
                    const hadText = messageInput.value.trim();

                    // 'aborted'(iOSでのTTS直後の競合)・'no-speech'(まだ何も話していない)は
                    // どちらも「お客様側の問題ではない一時的な状態」なので、同じ扱いで
                    // 静かに自動再試行する。
                    if ((lastRecognitionError === 'aborted' || lastRecognitionError === 'no-speech') && !ended) {
                        if (autoRetryBudget > 0) {
                            autoRetryBudget -= 1;
                            lastRecognitionError = null;
                            setTimeout(() => {
                                recognizer = createRecognizer();
                                try { recognizer.start(); } catch (e) {}
                            }, 350);
                            return;
                        }
                    }
                    lastRecognitionError = null;

                    if (hadText) {
                        inputForm.requestSubmit();
                    } else if (!ended) {
                        // 何らかの理由で聞き取りが終わったが発話内容が無い場合、
                        // 「🎤 聞いています...」の表示を放置しない
                        // (実際には聞き取りが止まっているのに、まだ聞いているように
                        // 見えてしまい「話しかけても反応がない」状態になるのを防ぐ)。
                        voiceStatus.textContent = '🎤 マイクのボタンを押して話しかけてください';
                    }
                };
                return rec;
            }

            recognizer = createRecognizer();

            const startListening = () => {
                if (ended || listening) return;
                messageInput.value = '';
                autoRetryBudget = 3;
                // 毎ターン新しいインスタンスで開始する（上記コメント参照）
                recognizer = createRecognizer();
                try { recognizer.start(); } catch (e) { /* 連打対策 */ }
            };

            // 手動でのタップも引き続き可能（自動判定が誤って早く/遅く切れた場合の保険）
            micBtn.addEventListener('click', () => { listening ? recognizer.stop() : startListening(); });
            bigMicBtn.addEventListener('click', () => { listening ? recognizer.stop() : startListening(); });

            window.__startListening = startListening;
        } else {
            micBtn.disabled = true;
            micBtn.title = 'このブラウザは音声入力に対応していません';
            micBtn.style.opacity = '0.4';
            bigMicBtn.disabled = true;
            voiceStatus.textContent = 'このブラウザは音声入力に対応していません。チャット欄にご入力ください。';
            window.__startListening = () => {};
        }

        // ===== 音声合成(AIの返答を読み上げ) =====
        function speak(text, onDone) {
            if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
            try {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ja-JP';
                const jaVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
                if (jaVoice) utter.voice = jaVoice;
                micBtn.classList.add('speaking');
                bigMicBtn.classList.add('speaking');
                utter.onend = () => {
                    micBtn.classList.remove('speaking');
                    bigMicBtn.classList.remove('speaking');
                    if (onDone) onDone();
                };
                utter.onerror = () => {
                    micBtn.classList.remove('speaking');
                    bigMicBtn.classList.remove('speaking');
                    if (onDone) onDone();
                };
                window.speechSynthesis.speak(utter);
            } catch (e) {
                if (onDone) onDone();
            }
        }
        if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }

        function addBubble(text, cls) {
            const el = document.createElement('div');
            el.className = 'bubble ' + cls;
            el.textContent = text;
            chatWindow.appendChild(el);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function api(path, body) {
            const res = await fetch('/api/v1/shops/' + encodeURIComponent(shopId) + '/booking-ai' + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {}),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.detail || ('HTTPエラー: ' + res.status));
            }
            return data;
        }

        function onAiReply(text, { end, booked } = {}) {
            addBubble(text, 'ai');
            if (end) {
                ended = true;
                messageInput.disabled = true;
                inputForm.querySelector('button[type=submit]').disabled = true;
                micBtn.disabled = true;
                bigMicBtn.disabled = true;
                const banner = document.createElement('div');
                banner.className = 'ended-banner';
                banner.textContent = booked
                    ? '🎉 ご予約が完了しました。このページは閉じていただいて構いません。'
                    : 'AI予約受付はここで終了しました。もう一度やり直す場合はページを再読み込みしてください。';
                chatWindow.appendChild(banner);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
            if (mode === 'voice' && !ended) {
                // iOSではTTSとマイクが音声セッションを奪い合うことがあるため、
                // 読み上げ終了から少し間を空けてからマイクを再開する
                speak(text, () => setTimeout(() => window.__startListening(), 400));
            } else if (mode === 'voice' && ended) {
                speak(text);
            }
        }

        async function startSession() {
            try {
                const data = await api('/start', {});
                sessionId = data.session_id;
                pageShopName.textContent = data.shop_name + ' - AIでご予約';
                loadingEl.style.display = 'none';
                notFoundEl.style.display = 'none';
                contentEl.style.display = 'flex';

                const greeting = 'お電話ありがとうございます。こちら' + data.shop_name + 'の予約受付AIです。'
                    + 'ご来店のご希望日時やお名前などをお聞かせください。';
                onAiReply(greeting, {});
            } catch (e) {
                loadingEl.style.display = 'none';
                startCallScreenEl.style.display = 'none';
                notFoundEl.style.display = 'block';
                notFoundEl.textContent = 'ご案内の準備に失敗しました: ' + e.message;
            }
        }

        inputForm.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const text = messageInput.value.trim();
            if (!text || ended || !sessionId) return;
            messageInput.value = '';
            addBubble(text, 'caller');
            const sendBtn = inputForm.querySelector('button[type=submit]');
            sendBtn.disabled = true;
            micBtn.disabled = true;

            try {
                const data = await api('/chat', { session_id: sessionId, message: text });
                onAiReply(data.reply, { end: data.end_call, booked: data.booked });
            } catch (e) {
                addBubble('エラー: ' + e.message, 'system');
            } finally {
                if (!ended) {
                    sendBtn.disabled = false;
                    if (SpeechRecognitionCtor) micBtn.disabled = false;
                }
            }
        });

        window.addEventListener('beforeunload', () => {
            if (sessionId && !ended) {
                try {
                    navigator.sendBeacon(
                        '/api/v1/shops/' + encodeURIComponent(shopId) + '/booking-ai/end',
                        new Blob([JSON.stringify({ session_id: sessionId })], { type: 'application/json' })
                    );
                } catch (e) {}
            }
        });

        if (mode !== 'voice') {
            startSession();
        }
    </script>
</body>
</html>
