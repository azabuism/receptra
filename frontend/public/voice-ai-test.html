<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電話AI受付テスト - レセプトラ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35;
            --primary-light: #ff9500;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --error: #ef4444;
            --success: #10b981;
            --border: 1px solid #ddd;
        }
        html, body { height: 100%; overflow-x: hidden; max-width: 100%; }
        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--white);
            border-bottom: var(--border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        header h1 {
            font-size: 18px;
            color: var(--primary);
        }
        header .sub {
            font-size: 12px;
            color: #888;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .notice {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #9a3412;
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        select, input[type=text] {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 10px;
            border: var(--border);
            border-radius: 8px;
        }
        button {
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 700;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #eee; color: var(--dark); }
        .btn-secondary:hover { background: #ddd; }
        #chatWindow {
            flex: 1;
            min-height: 320px;
            max-height: 55vh;
            overflow-y: auto;
            background: var(--white);
            border: var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .bubble.caller {
            align-self: flex-end;
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.ai {
            align-self: flex-start;
            background: var(--light);
            color: var(--dark);
            border-bottom-left-radius: 4px;
        }
        .bubble.meta {
            align-self: flex-start;
            font-size: 11px;
            color: #999;
            padding: 0 4px;
        }
        .bubble.system {
            align-self: center;
            font-size: 12px;
            color: #b91c1c;
            background: #fee2e2;
            border-radius: 8px;
        }
        form#inputForm {
            display: flex;
            gap: 8px;
        }
        form#inputForm input[type=text] {
            flex: 1;
        }
        #statsBar {
            background: var(--white);
            border: var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            color: #555;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
        }
        #statsBar b { color: var(--dark); }
        .ended-banner {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
        footer {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            padding: 12px;
        }
        @media (max-width: 480px) {
            header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>📞 電話AI受付テスト</h1>
            <div class="sub">実際の電話番号なしで、AI受付と直接会話できる検証用ページです</div>
        </div>
    </header>

    <div class="container">
        <div class="notice">
            ここでの発話は、実際にお客様から電話がかかってきたとき想定で自由に入力してください（例：「明日19時の予約の田中です」「営業のお電話です」など）。実際にOpenAI APIを呼び出すため、わずかに課金が発生します。会話は「AIが用件を聞き終えた」と判断すると自動的に終了します。
        </div>

        <div class="controls">
            <label for="modelSelect" style="font-size:13px;color:#666;">モデル:</label>
            <select id="modelSelect">
                <option value="">サーバー既定値を使用</option>
                <option value="gpt-5.6-luna">gpt-5.6-luna（低コスト・低遅延）</option>
                <option value="gpt-5.6-terra">gpt-5.6-terra</option>
                <option value="gpt-5.6-sol">gpt-5.6-sol（高精度）</option>
            </select>
            <button class="btn-secondary" id="resetBtn" type="button">会話をリセット</button>
        </div>

        <div id="chatWindow"></div>

        <form id="inputForm">
            <input type="text" id="messageInput" placeholder="お客様の発話を入力..." autocomplete="off" />
            <button class="btn-primary" type="submit">送信</button>
        </form>

        <div id="statsBar">
            <span>モデル: <b id="statModel">-</b></span>
            <span>累計トークン: <b id="statTokens">0</b>（入力 <span id="statPrompt">0</span> / 出力 <span id="statCompletion">0</span>）</span>
            <span>概算コスト: <b id="statCost">-</b></span>
        </div>
    </div>

    <footer>RECEPTRA 電話AI受付 検証用ページ（オーナー専用）</footer>

    <script>
        const token = localStorage.getItem('receptra_token');
        if (!token) {
            window.location.href = 'owner-login.html';
        }

        const chatWindow = document.getElementById('chatWindow');
        const inputForm = document.getElementById('inputForm');
        const messageInput = document.getElementById('messageInput');
        const resetBtn = document.getElementById('resetBtn');
        const modelSelect = document.getElementById('modelSelect');
        const statModel = document.getElementById('statModel');
        const statTokens = document.getElementById('statTokens');
        const statPrompt = document.getElementById('statPrompt');
        const statCompletion = document.getElementById('statCompletion');
        const statCost = document.getElementById('statCost');

        let sessionId = null;
        let ended = false;

        function addBubble(text, cls) {
            const el = document.createElement('div');
            el.className = 'bubble ' + cls;
            el.textContent = text;
            chatWindow.appendChild(el);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return el;
        }

        function addMeta(text) {
            const el = document.createElement('div');
            el.className = 'bubble meta';
            el.textContent = text;
            chatWindow.appendChild(el);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function apiFetch(path, body) {
            const res = await fetch('/api/v1/voice-ai' + path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                },
                body: JSON.stringify(body || {}),
            });
            if (res.status === 401 || res.status === 403) {
                window.location.href = 'owner-login.html';
                throw new Error('unauthorized');
            }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.detail || ('HTTPエラー: ' + res.status));
            }
            return data;
        }

        function updateStats(data) {
            statModel.textContent = data.model || '-';
            const usage = data.cumulative_usage || { prompt_tokens: 0, completion_tokens: 0 };
            statPrompt.textContent = usage.prompt_tokens;
            statCompletion.textContent = usage.completion_tokens;
            statTokens.textContent = usage.prompt_tokens + usage.completion_tokens;
            if (data.estimated_cost_jpy !== null && data.estimated_cost_jpy !== undefined) {
                statCost.textContent = '約¥' + data.estimated_cost_jpy + '（$' + data.estimated_cost_usd + '）';
            } else {
                statCost.textContent = 'このモデルの単価は未登録';
            }
        }

        async function startSession() {
            chatWindow.innerHTML = '';
            ended = false;
            inputForm.querySelector('button').disabled = false;
            messageInput.disabled = false;
            try {
                const data = await apiFetch('/chat/start', {});
                sessionId = data.session_id;
                addMeta('新しい通話を開始しました。お客様の発話を入力してください。');
            } catch (e) {
                addBubble('セッション開始に失敗しました: ' + e.message, 'system');
            }
        }

        inputForm.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const text = messageInput.value.trim();
            if (!text || ended || !sessionId) return;
            messageInput.value = '';
            addBubble(text, 'caller');
            const sendBtn = inputForm.querySelector('button');
            sendBtn.disabled = true;

            try {
                const data = await apiFetch('/chat', {
                    session_id: sessionId,
                    message: text,
                    model: modelSelect.value || undefined,
                });
                addBubble(data.reply, 'ai');
                addMeta('分類: ' + data.category + ' / 緊急度: ' + (data.urgency || '-') + (data.summary ? ' / 要約: ' + data.summary : ''));
                updateStats(data);
                if (data.end_call) {
                    ended = true;
                    const banner = document.createElement('div');
                    banner.className = 'ended-banner';
                    banner.textContent = 'AIが通話を終了しました（実際の電話ではここで切断されます）。「会話をリセット」で次のテストができます。';
                    chatWindow.appendChild(banner);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    messageInput.disabled = true;
                }
            } catch (e) {
                addBubble('エラー: ' + e.message, 'system');
            } finally {
                sendBtn.disabled = false;
            }
        });

        resetBtn.addEventListener('click', async () => {
            if (sessionId) {
                try { await apiFetch('/chat/end', { session_id: sessionId }); } catch (e) {}
            }
            await startSession();
        });

        startSession();
    </script>
</body>
</html>
