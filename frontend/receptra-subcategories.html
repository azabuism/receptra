<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サブカテゴリー選択 - レセプトラ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'メイリオ', Meiryo, sans-serif;
            background: linear-gradient(135deg, #FF6600 0%, #FF8833 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .breadcrumb {
            margin-bottom: 30px;
        }

        .breadcrumb a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .breadcrumb a:hover {
            opacity: 1;
        }

        .breadcrumb span {
            color: white;
            opacity: 0.7;
            margin: 0 10px;
        }

        .current {
            color: white;
            font-size: 14px;
            display: inline;
        }

        .subcategories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .subcategory-card {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .subcategory-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .subcategory-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subcategory-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .subcategory-count {
            font-size: 12px;
            color: #999;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .footer {
            background: rgba(0, 0, 0, 0.1);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin-top: 50px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .footer a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .subcategories-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .subcategory-card {
                padding: 20px 15px;
            }

            .subcategory-icon {
                font-size: 36px;
                margin-bottom: 10px;
            }

            .subcategory-name {
                font-size: 14px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- ロゴナビゲーション -->
    <div style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
        <a href="receptra-homepage-improved.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
            <img src="receptra-logo.png" alt="RECEPTRA Logo" style="width: 48px; height: 48px;">
        </a>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="receptra-homepage-improved.html">← ホーム</a>
            <span>/</span>
            <span class="current" id="breadcrumb-category">カテゴリー</span>
        </div>

        <div class="header">
            <h1 id="category-title">カテゴリー選択</h1>
            <p id="category-description">カテゴリーを選択してサービスを探す</p>
        </div>

        <div id="subcategories-container" class="subcategories-grid">
            <!-- Dynamic content will be inserted here -->
        </div>

        <div class="footer">
            <a href="#privacy">プライバシーポリシー</a>
            <a href="#terms">利用規約</a>
            <a href="#contact">お問い合わせ</a>
        </div>
    </div>

                    { name: 'ラーメン', icon: '🍜', count: '0件', image: 'category-restaurant-ramen' },
                    { name: '寿司・刺身', icon: '🍣', count: '0件', image: 'category-restaurant-sushi' },
                    { name: 'イタリアン', icon: '🍝', count: '0件', image: 'category-restaurant-italian' },

                    { name: '居酒屋', icon: '🍺', count: '0件', image: 'category-restaurant-izakaya' },
                    { name: 'ハンバーガー', icon: '🍔', count: '0件', image: 'category-restaurant-hamburger' },
                    { name: 'ステーキ', icon: '🥩', count: '0件', image: 'category-restaurant-steak' },
                    { name: 'パン屋', icon: '🥐', count: '0件', image: 'category-restaurant-bakery' },
                    { name: 'デリ・弁当', icon: '🍱', count: '0件', image: 'category-restaurant-deli-bento' }
                ]
            },

                icon: '💄',
                items: [
                    { name: 'ヘアサロン', icon: '💇', count: '0件' },
                    { name: 'ネイルサロン', icon: '💅', count: '0件' },
                    { name: 'エステ・脱毛', icon: '✨', count: '0件' },
                    { name: 'マッサージ', icon: '🙏', count: '0件' },
                    { name: '皮膚科', icon: '🩺', count: '0件' },
                    { name: 'メイク・コスメ', icon: '💄', count: '0件' },

                ]
            },
            hotel: {
                title: 'ホテル・宿泊',
                description: 'ホテルや宿泊施設から最適な施設を探す',
                icon: '🏨',
                items: [
                    { name: 'ビジネスホテル', icon: '🏢', count: '0件', image: 'category-hotel-business' },
                    { name: 'リゾートホテル', icon: '🏖️', count: '0件', image: 'category-hotel-resort' },

                ]
            },

                icon: '📚',
                items: [
                    { name: '語学スクール', icon: '🗣️', count: '0件', image: 'category-education-language' },
                    { name: 'プログラミング', icon: '💻', count: '0件', image: 'category-education-programming' },
                    { name: '音楽教室', icon: '🎵', count: '0件', image: 'category-education-music' },
                    { name: 'アート教室', icon: '🎨', count: '0件', image: 'category-education-art' },
                    { name: '家庭教師・塾', icon: '📖', count: '0件', image: 'category-education-tutoring' },
                    { name: 'ヨガ・ダンス', icon: '💃', count: '0件', image: 'category-education-yoga' },
                ]
            },
            medical: {

                icon: '🏥',
                items: [

                    { name: '総合病院', icon: '🏥', count: '0件', image: 'category-medical-hospital' },

                    { name: '皮膚科', icon: '🩺', count: '0件', image: 'category-medical-dermatology' },
                    { name: '整形外科', icon: '🦴', count: '0件' },
                    { name: '心療内科', icon: '🧠', count: '0件' },
                    { name: 'リハビリ', icon: '🏃', count: '0件', image: 'category-medical-rehabilitation' }
                ]
            },
            fitness: {
                title: 'フィットネス',
                description: 'フィットネス施設から最適なジムを探す',
                icon: '💪',
                items: [
                    { name: 'フィットネスジム', icon: '🏋️', count: '0件' },
                    { name: 'ヨガスタジオ', icon: '🧘', count: '0件' },
                    { name: 'ボクシングジム', icon: '🥊', count: '0件' },
                    { name: 'スイミングスクール', icon: '🏊', count: '0件' },
                    { name: 'テニススクール', icon: '🎾', count: '0件' },
                    { name: 'ダンススクール', icon: '💃', count: '0件' },
                    { name: 'ピラティス', icon: '🧘‍♀️', count: '0件' },
                    { name: 'サッカー・フットサル', icon: '⚽', count: '0件' }
                ]
            },
            entertainment: {
                title: 'エンタメ・趣味',
                description: 'エンタメ・趣味施設から最適な場所を探す',
                icon: '🎬',
                items: [
                    { name: 'カラオケ', icon: '🎤', count: '0件', image: 'category-entertainment-karaoke' },
                    { name: 'ゲームセンター', icon: '🕹️', count: '0件', image: 'category-entertainment-gamecenter' },
                    { name: 'ボウリング', icon: '🎳', count: '0件', image: 'category-entertainment-bowling' },
                    { name: 'シネマ', icon: '🎬', count: '0件', image: 'category-entertainment-cinema' },
                    { name: '美術館', icon: '🎨', count: '0件', image: 'category-entertainment-artmuseum' },
                    { name: 'アミューズメントパーク', icon: '🎡', count: '0件', image: 'category-entertainment-amusementpark' }
                ]
            }
        };

        // Get category from URL parameters
        function getCategoryFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('category') || 'restaurant';
        }

        // Initialize page
        function initializePage() {
            const category = getCategoryFromURL();
            const data = subcategoriesData[category];

            if (!data) {
                showErrorState();
                return;
            }

            // Update header
            document.getElementById('category-title').textContent = data.title;
            document.getElementById('category-description').textContent = data.description;
            document.getElementById('breadcrumb-category').textContent = data.title;

            // Render subcategories
            const container = document.getElementById('subcategories-container');
            container.innerHTML = data.items.map(item => {
                let iconHtml = '';
                if (item.image) {
                    iconHtml = `<picture>
                        <source srcset="${item.image}.webp" type="image/webp">
                        <img src="${item.image}.jpg" alt="${item.name}" loading="lazy" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px;">
                    </picture>`;
                } else {
                    iconHtml = item.icon;
                }
                return `
                    <a href="receptra-results.html?category=${category}&subcategory=${encodeURIComponent(item.name)}" class="subcategory-card">
                        <div class="subcategory-icon">${iconHtml}</div>
                        <div class="subcategory-name">${item.name}</div>
                        <div class="subcategory-count">${item.count}</div>
                    </a>
                `;
            }).join('');
        }

        function showErrorState() {
            const container = document.getElementById('subcategories-container');
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                    <p style="color: white; font-size: 16px;">カテゴリーが見つかりません</p>
                </div>
            `;
            document.getElementById('category-title').textContent = 'エラー';
            document.getElementById('category-description').textContent = 'カテゴリーが見つかりません';
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializePage);

        // Handle back button
        document.querySelector('.breadcrumb a').addEventListener('click', function(e) {
            // Allow default navigation to homepage
        });
    </script>
</body>
</html>
