<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="レセプトラ - 店舗登録ページ">
    <title>店舗登録 - RECEPTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-light: #ff9500;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --border: #ddd;
        }

        html, body {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* ナビゲーション */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            height: 60px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--dark);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo svg {
            width: 100%;
            height: 100%;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-button {
            background: none;
            border: none;
            color: var(--dark);
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-button:hover {
            background: var(--light);
        }

        /* メインコンテンツ */
        main {
            margin-top: 60px;
            min-height: calc(100vh - 60px);
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 12px;
            color: var(--dark);
        }

        .page-header p {
            font-size: 16px;
            color: #666;
        }

        /* フォーム */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .required {
            color: var(--primary);
            font-weight: 600;
        }

        .form-help {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* チェックボックス */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        /* ボタン */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--light);
        }

        /* フッター */
        footer {
            background: var(--dark);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            font-size: 12px;
            margin-top: 60px;
        }

        footer p {
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            nav {
                height: 50px;
            }

            main {
                margin-top: 50px;
                padding: 24px 16px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- ナビゲーション -->
    <nav>
        <a href="./receptra-homepage-with-subcategory-icons.html" class="nav-brand">
            <div class="nav-logo">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="30" fill="#FF6B35" opacity="0.12"/>
                    <circle cx="32" cy="32" r="30" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
                    <g fill="#FF6B35" stroke="none">
                        <rect x="20" y="14" width="5" height="36" rx="2.5"/>
                        <circle cx="31" cy="26" r="10" fill="#FF6B35"/>
                        <g stroke="#FF6B35" stroke-width="3" stroke-linecap="round" fill="none">
                            <line x1="30" y1="36" x2="44" y2="48"/>
                        </g>
                    </g>
                    <g fill="#FF6B35" opacity="0.7">
                        <circle cx="48" cy="16" r="1.5"/>
                        <circle cx="50" cy="20" r="1"/>
                        <circle cx="46" cy="22" r="0.8"/>
                    </g>
                </svg>
            </div>
            <span>RECEPTRA</span>
        </a>
        <div class="nav-right">
            <button class="nav-button">ログイン</button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>店舗登録</h1>
                <p>あなたのお店をRECEPTRAに登録して、予約を増やしましょう</p>
            </div>

            <form id="storeRegisterForm">
                <!-- 基本情報 -->
                <div class="form-group">
                    <label for="storeName">店舗名 <span class="required">*</span></label>
                    <input type="text" id="storeName" name="storeName" placeholder="例：○○レストラン" required>
                    <div class="form-help">正式な店舗名を入力してください</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">業種 <span class="required">*</span></label>
                        <select id="category" name="category" required>
                            <option value="">選択してください</option>
                            <option value="gourmet">グルメ</option>
                            <option value="beauty">ビューティー</option>
                            <option value="hotel">ホテル</option>
                            <option value="education">教育</option>
                            <option value="healthcare">ヘルスケア</option>
                            <option value="fitness">フィットネス</option>
                            <option value="shopping">ショッピング</option>
                            <option value="other">その他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="subcategory">詳細カテゴリ <span class="required">*</span></label>
                        <input type="text" id="subcategory" name="subcategory" placeholder="例：ラーメン、パスタ">
                    </div>
                </div>

                <!-- 連絡先情報 -->
                <div class="form-group">
                    <label for="email">メールアドレス <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@store.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">電話番号 <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="09012345678" required>
                    </div>
                    <div class="form-group">
                        <label for="website">ウェブサイト（任意）</label>
                        <input type="url" id="website" name="website" placeholder="https://example.com">
                    </div>
                </div>

                <!-- 住所情報 -->
                <div class="form-group">
                    <label for="prefecture">都道府県 <span class="required">*</span></label>
                    <select id="prefecture" name="prefecture" required>
                        <option value="">選択してください</option>
                        <option value="hokkaido">北海道</option>
                        <option value="aomori">青森県</option>
                        <option value="iwate">岩手県</option>
                        <option value="miyagi">宮城県</option>
                        <option value="akita">秋田県</option>
                        <option value="yamagata">山形県</option>
                        <option value="fukushima">福島県</option>
                        <option value="ibaraki">茨城県</option>
                        <option value="tochigi">栃木県</option>
                        <option value="gunma">群馬県</option>
                        <option value="saitama">埼玉県</option>
                        <option value="chiba">千葉県</option>
                        <option value="tokyo">東京都</option>
                        <option value="kanagawa">神奈川県</option>
                        <option value="niigata">新潟県</option>
                        <option value="toyama">富山県</option>
                        <option value="ishikawa">石川県</option>
                        <option value="fukui">福井県</option>
                        <option value="yamanashi">山梨県</option>
                        <option value="nagano">長野県</option>
                        <option value="gifu">岐阜県</option>
                        <option value="shizuoka">静岡県</option>
                        <option value="aichi">愛知県</option>
                        <option value="mie">三重県</option>
                        <option value="shiga">滋賀県</option>
                        <option value="kyoto">京都府</option>
                        <option value="osaka">大阪府</option>
                        <option value="hyogo">兵庫県</option>
                        <option value="nara">奈良県</option>
                        <option value="wakayama">和歌山県</option>
                        <option value="tottori">鳥取県</option>
                        <option value="shimane">島根県</option>
                        <option value="okayama">岡山県</option>
                        <option value="hiroshima">広島県</option>
                        <option value="yamaguchi">山口県</option>
                        <option value="tokushima">徳島県</option>
                        <option value="kagawa">香川県</option>
                        <option value="ehime">愛媛県</option>
                        <option value="kochi">高知県</option>
                        <option value="fukuoka">福岡県</option>
                        <option value="saga">佐賀県</option>
                        <option value="nagasaki">長崎県</option>
                        <option value="kumamoto">熊本県</option>
                        <option value="oita">大分県</option>
                        <option value="miyazaki">宮崎県</option>
                        <option value="kagoshima">鹿児島県</option>
                        <option value="okinawa">沖縄県</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">住所（番地まで） <span class="required">*</span></label>
                    <input type="text" id="address" name="address" placeholder="例：渋谷区道玄坂1-2-3" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="openTime">営業開始時間 <span class="required">*</span></label>
                        <input type="time" id="openTime" name="openTime" required>
                    </div>
                    <div class="form-group">
                        <label for="closeTime">営業終了時間 <span class="required">*</span></label>
                        <input type="time" id="closeTime" name="closeTime" required>
                    </div>
                </div>

                <!-- 店舗説明 -->
                <div class="form-group">
                    <label for="description">店舗紹介（任意）</label>
                    <textarea id="description" name="description" placeholder="お店の特徴や雰囲気などを教えてください。200文字程度が目安です。"></textarea>
                    <div class="form-help">お客様に見られます。魅力的に表現してください。</div>
                </div>

                <!-- パスワード -->
                <div class="form-group">
                    <label for="password">パスワード <span class="required">*</span></label>
                    <input type="password" id="password" name="password" placeholder="8文字以上" required>
                    <div class="form-help">8文字以上の英数字と記号を含むパスワードをお勧めします</div>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">パスワード確認 <span class="required">*</span></label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="パスワード確認" required>
                </div>

                <!-- 利用規約 -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">利用規約と個人情報保護方針に同意します <span class="required">*</span></label>
                </div>

                <!-- ボタン -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">キャンセル</button>
                    <button type="submit" class="btn btn-primary">登録する</button>
                </div>
            </form>
        </div>
    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; 2024 RECEPTRA. All rights reserved.</p>
        <p>複合業種対応プラットフォーム by BARIYON</p>
    </footer>

    <script>
        document.getElementById('storeRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // パスワード確認
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (password !== passwordConfirm) {
                alert('パスワードが一致しません');
                return;
            }

            // 利用規約確認
            if (!document.getElementById('terms').checked) {
                alert('利用規約に同意してください');
                return;
            }

            alert('店舗登録フォームを送信しました\n実装時にはサーバーに送信します');
            // 実装時：
            // fetch('/api/store/register', {
            //     method: 'POST',
            //     body: new FormData(this)
            // }).then(response => response.json())
            //   .then(data => {
            //       alert('登録完了しました');
            //       window.location.href = '/store/dashboard';
            //   });
        });
    </script>
</body>
</html>
