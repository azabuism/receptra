<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RECEPTRA 店舗オーナーログイン - あなたの店舗を管理">
    <title>店舗ログイン - RECEPTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-light: #ff9500;
            --primary-dark: #e66d00;
            --dark: #333333;
            --light: #f5f5f5;
            --white: #ffffff;
            --error: #ef4444;
            --gray: #999;
            --border: 1px solid #ddd;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #ff9500 100%);
            color: var(--dark);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.2);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--gray);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #eee;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            padding: 0 12px;
            font-size: 12px;
            color: var(--gray);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--gray);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--error);
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #10b981;
            display: none;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark);
            color: var(--white);
            padding: 12px;
            text-align: center;
            font-size: 11px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 6px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* ローディング */
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn:disabled::after {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* レスポンシブ */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">RECEPTRA</div>
            <h1 class="title">店舗ログイン</h1>
            <p class="subtitle">あなたの店舗を管理</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" placeholder="store@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワード" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" style="margin: 0;">ログイン情報を保存する</label>
            </div>

            <button type="submit" class="btn btn-primary">ログイン</button>
        </form>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">または</div>
            <div class="divider-line"></div>
        </div>

        <button class="btn btn-secondary" onclick="goToRegister()">新規店舗登録</button>

        <div class="back-link">
            <a href="receptra-homepage-with-subcategory-icons.html">← ホームに戻る</a>
        </div>

        <div class="footer">
            <p>問題が発生していますか？ <a href="#">サポートへ連絡</a></p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <a href="https://www.bariyon.com/privacy.html" target="_blank">プライバシーポリシー</a> |
        <a href="https://www.bariyon.com/terms.html" target="_blank">利用規約</a> |
        <a href="https://www.bariyon.com/contact.html" target="_blank">お問い合わせ</a>
    </footer>

    <script>
        const STORAGE_KEY = 'receptra_store_login';

        // ページロード時に保存されたメールアドレスを復元
        document.addEventListener('DOMContentLoaded', () => {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            if (saved.email) {
                document.getElementById('email').value = saved.email;
                document.getElementById('remember').checked = true;
            }

            // URLパラメータをチェック（登録完了メッセージ）
            const params = new URLSearchParams(window.location.search);
            if (params.get('registered') === 'true') {
                showSuccess('店舗登録が完了しました。ログインしてください。');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember').checked;

            // バリデーション
            if (!email || !password) {
                showError('メールアドレスとパスワードを入力してください');
                return;
            }

            // ローカルストレージから登録済みアカウント確認（デモ用）
            const registrationData = JSON.parse(localStorage.getItem('receptra_store_register') || '{}');

            if (!registrationData.email) {
                showError('このメールアドレスは登録されていません。まず新規登録をしてください。');
                return;
            }

            if (registrationData.email !== email) {
                showError('メールアドレスが一致しません');
                return;
            }

            // 本来はハッシュ化されたパスワードと比較
            if (registrationData.password !== password) {
                showError('パスワードが正しくありません');
                return;
            }

            // ログイン成功
            if (rememberMe) {
                const loginData = {
                    email: email,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(loginData));
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }

            // セッション情報を保存
            sessionStorage.setItem('receptra_authenticated', 'true');
            sessionStorage.setItem('receptra_store_email', email);
            sessionStorage.setItem('receptra_store_name', registrationData.shopName || 'My Store');

            showSuccess('ログインしています...');
            setTimeout(() => {
                window.location.href = 'receptra-store-dashboard.html';
            }, 1000);
        }

        function goToRegister() {
            window.location.href = 'receptra-store-register.html';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        // テスト用アカウント
        function loadTestAccount() {
            document.getElementById('email').value = 'store@example.com';
            document.getElementById('password').value = 'Password123';
        }

        // デモデータ初期化
        function initializeDemoData() {
            const demoData = {
                email: 'demo@store.com',
                password: 'Demo123',
                shopName: 'デモ店舗'
            };
            localStorage.setItem('receptra_store_register', JSON.stringify(demoData));
            document.getElementById('email').value = demoData.email;
            document.getElementById('password').value = demoData.password;
            showSuccess('デモアカウントが設定されました。ログインボタンをクリックしてください。');
        }
    </script>
</body>
</html>
