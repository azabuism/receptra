<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - レセプトラ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'メイリオ', Meiryo, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #FF6600 0%, #FF8833 100%);
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .breadcrumb {
            margin-bottom: 20px;
            font-size: 14px;
        }

        .breadcrumb a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .breadcrumb a:hover {
            opacity: 1;
        }

        .breadcrumb span {
            color: rgba(255, 255, 255, 0.6);
            margin: 0 8px;
        }

        .search-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .search-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .filters-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-item {
            background: #f0f0f0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .filter-remove:hover {
            opacity: 1;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .result-count {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .sort-options {
            display: flex;
            gap: 10px;
        }

        .sort-btn {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .sort-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .sort-btn:hover:not(.active) {
            border-color: #667eea;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .result-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        .result-content {
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .result-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .result-category {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .result-address {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .result-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .stars {
            color: #ffc107;
        }

        .result-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }

        .result-phone {
            font-size: 12px;
            color: #667eea;
            font-weight: 500;
        }

        .result-btn {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .result-btn:hover {
            background: #764ba2;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }

        .empty-state p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .empty-state-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .empty-state-btn:hover {
            background: #764ba2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }

            .filter-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .sort-options {
                width: 100%;
                justify-content: flex-start;
            }

            .search-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- ロゴナビゲーション -->
    <div style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
        <a href="receptra-homepage-improved.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
            <img src="receptra-logo.png" alt="RECEPTRA Logo" style="width: 48px; height: 48px;">
        </a>
    </div>

    <div class="header">
        <div class="header-content">
            <div class="breadcrumb">
                <a href="receptra-homepage-improved.html">← ホーム</a>
                <span>/</span>
                <span id="breadcrumb-current">検索結果</span>
            </div>
            <h1 class="search-title" id="search-title">検索結果</h1>
            <p class="search-subtitle" id="search-subtitle">検索条件に合致したサービスが見つかりました</p>
        </div>
    </div>

    <div class="container">
        <div class="filters-section" id="filters-section" style="display: none;">
            <div class="filter-group" id="filters-group">
                <!-- Filters will be inserted here -->
            </div>
        </div>

        <div class="results-header">
            <div class="result-count" id="result-count">結果を読み込み中...</div>
            <div class="sort-options">
                <button class="sort-btn active" onclick="sortResults('rating')">評価順</button>
                <button class="sort-btn" onclick="sortResults('distance')">距離順</button>
                <button class="sort-btn" onclick="sortResults('newest')">新着順</button>
            </div>
        </div>

        <div class="results-grid" id="results-grid">
            <!-- Results will be inserted here -->
        </div>

        <div class="pagination" id="pagination">
            <!-- Pagination will be inserted here -->
        </div>
    </div>

    <script>
        // Sample data for demo purposes
        const sampleResults = [
            {
                id: 1,
                name: 'レストラン太郎',
                category: '飲食店',
                subcategory: 'ラーメン',
                address: '東京都渋谷区道玄坂1-2-3',
                phone: '03-XXXX-XXXX',
                rating: 4.5,
                reviews: 128,
                icon: '🍜'
            },
            {
                id: 2,
                name: '寿司処 海',
                category: '飲食店',
                subcategory: '寿司・刺身',
                address: '東京都新宿区歌舞伎町2-1-5',
                phone: '03-YYYY-YYYY',
                rating: 4.8,
                reviews: 245,
                icon: '🍣'
            },
            {
                id: 3,
                name: 'カフェ ナチュラル',
                category: '飲食店',
                subcategory: 'カフェ',
                address: '東京都渋谷区神宮前1-1-1',
                phone: '03-ZZZZ-ZZZZ',
                rating: 4.3,
                reviews: 89,
                icon: '☕'
            },
            {
                id: 4,
                name: 'ヘアサロン LIGHT',
                category: '美容',
                subcategory: 'ヘアサロン',
                address: '東京都渋谷区宮益坂1-1-1',
                phone: '03-AAAA-AAAA',
                rating: 4.7,
                reviews: 156,
                icon: '💇'
            },
            {
                id: 5,
                name: 'ホテル グランド',
                category: 'ホテル',
                subcategory: 'ビジネスホテル',
                address: '東京都千代田区丸の内1-1-1',
                phone: '03-BBBB-BBBB',
                rating: 4.6,
                reviews: 312,
                icon: '🏨'
            },
            {
                id: 6,
                name: 'フィットネス ジム プロ',
                category: 'フィットネス',
                subcategory: 'フィットネスジム',
                address: '東京都港区六本木7-1-1',
                phone: '03-CCCC-CCCC',
                rating: 4.4,
                reviews: 78,
                icon: '🏋️'
            }
        ];

        let currentSort = 'rating';
        let currentPage = 1;
        const resultsPerPage = 12;

        // Get search parameters from URL
        function getSearchParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                category: params.get('category'),
                subcategory: params.get('subcategory'),
                location: params.get('location'),
                searchType: params.get('searchType'),
                shopName: params.get('shopName')
            };
        }

        // Filter results based on search parameters
        function filterResults() {
            const params = getSearchParams();
            let filtered = [...sampleResults];

            if (params.category) {
                filtered = filtered.filter(item => item.category === params.category);
            }

            if (params.subcategory) {
                filtered = filtered.filter(item => item.subcategory === params.subcategory);
            }

            if (params.location) {
                filtered = filtered.filter(item =>
                    item.address.includes(params.location)
                );
            }

            if (params.shopName) {
                filtered = filtered.filter(item =>
                    item.name.includes(params.shopName)
                );
            }

            return filtered;
        }

        // Sort results
        function sortResults(type) {
            currentSort = type;
            currentPage = 1;

            // Update button states
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderResults();
        }

        // Render results
        function renderResults() {
            const params = getSearchParams();
            let results = filterResults();

            // Sort
            if (currentSort === 'rating') {
                results.sort((a, b) => b.rating - a.rating);
            } else if (currentSort === 'distance') {
                results.sort((a, b) => a.id - b.id);
            } else if (currentSort === 'newest') {
                results.sort((a, b) => b.id - a.id);
            }

            // Update header
            updateHeader(params, results.length);

            // Paginate
            const totalPages = Math.ceil(results.length / resultsPerPage);
            const start = (currentPage - 1) * resultsPerPage;
            const paginatedResults = results.slice(start, start + resultsPerPage);

            // Render results
            const grid = document.getElementById('results-grid');

            if (paginatedResults.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <h2>検索結果がありません</h2>
                            <p>申し訳ございません。条件に合致するサービスが見つかりませんでした。</p>
                            <a href="receptra-homepage-improved.html" class="empty-state-btn">ホームに戻る</a>
                        </div>
                    </div>
                `;
            } else {
                grid.innerHTML = paginatedResults.map(result => `
                    <div class="result-card">
                        <div class="result-image">${result.icon}</div>
                        <div class="result-content">
                            <div class="result-name">${result.name}</div>
                            <div class="result-category">${result.category} > ${result.subcategory}</div>
                            <div class="result-address">${result.address}</div>
                            <div class="result-rating">
                                <span class="stars">★★★★★</span>
                                <span>${result.rating.toFixed(1)} (${result.reviews}件)</span>
                            </div>
                            <div class="result-footer">
                                <div class="result-phone">${result.phone}</div>
                                <button class="result-btn" onclick="bookNow(${result.id})">予約</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Render pagination
            renderPagination(totalPages);

            // Update result count
            document.getElementById('result-count').textContent = `${results.length}件の検索結果`;
        }

        // Update header with search context
        function updateHeader(params, count) {
            let title = '検索結果';
            let breadcrumb = '検索結果';

            if (params.subcategory) {
                title = `${params.subcategory}の検索結果`;
                breadcrumb = params.subcategory;
            } else if (params.category) {
                title = `${params.category}の検索結果`;
                breadcrumb = params.category;
            } else if (params.location) {
                title = `${params.location}での検索結果`;
                breadcrumb = params.location;
            } else if (params.shopName) {
                title = `「${params.shopName}」の検索結果`;
                breadcrumb = params.shopName;
            }

            document.getElementById('search-title').textContent = title;
            document.getElementById('breadcrumb-current').textContent = breadcrumb;
            document.getElementById('search-subtitle').textContent = `${count}件のサービスが見つかりました`;

            // Update filters display
            updateFiltersDisplay(params);
        }

        // Update filter tags
        function updateFiltersDisplay(params) {
            const filtersSection = document.getElementById('filters-section');
            const filtersGroup = document.getElementById('filters-group');

            const filters = [];
            if (params.category) filters.push({ label: params.category, type: 'category' });
            if (params.subcategory) filters.push({ label: params.subcategory, type: 'subcategory' });
            if (params.location) filters.push({ label: params.location, type: 'location' });
            if (params.shopName) filters.push({ label: `「${params.shopName}」`, type: 'shopname' });

            if (filters.length > 0) {
                filtersSection.style.display = 'block';
                filtersGroup.innerHTML = filters.map(filter => `
                    <div class="filter-item">
                        ${filter.label}
                        <span class="filter-remove" onclick="removeFilter('${filter.type}')">✕</span>
                    </div>
                `).join('');
            }
        }

        // Remove filter
        function removeFilter(type) {
            const params = getSearchParams();
            const newParams = new URLSearchParams(window.location.search);

            if (type === 'category') newParams.delete('category');
            if (type === 'subcategory') newParams.delete('subcategory');
            if (type === 'location') newParams.delete('location');
            if (type === 'shopname') newParams.delete('shopName');

            const queryString = newParams.toString();
            window.location.search = queryString ? '?' + queryString : '';
        }

        // Render pagination
        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            if (currentPage > 1) {
                html += `<button onclick="changePage(${currentPage - 1})">← 前へ</button>`;
            }

            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button onclick="changePage(${currentPage + 1})">次へ →</button>`;
            }

            pagination.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            renderResults();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Book now
        function bookNow(id) {
            const result = sampleResults.find(r => r.id === id);
            alert(`${result.name}の予約ページに遷移します。`);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderResults);
    </script>
</body>
</html>
